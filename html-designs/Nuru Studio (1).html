const stepper=i=>`<div class="stp">${LB.map((l,k)=>`<div class="sn ${k<i?"done":k==i?"cur":""}"><span class="dotn">${k<i?CK2:k+1}</span><span class="lb">${l}</span></div>${k<4?`<div class="ln ${k<i?"on":""}"></div>`:""}`).join("")}</div><div class="stlab">Step ${i+1} of 5 · ${LB[i]}</div>`;
function bookShell(r){const i=ORDER.indexOf(r),h=HEAD[i];let body="";
 if(i==0)body=`${S.staff!="any"?`<div class="ok" style="margin:0 0 0.857rem">Booking with <b>${sf(S.staff).n}</b>. Only their services can be chosen. <button class="lnk" data-anyone>Choose anyone instead</button></div>`:""}${toolbar("services",svcCats()).replace('id="pq"','id="pq"')}<div id="list"></div>`;
 if(i==1)body=`${toolbar("team",stCats())}<div id="list"></div>`;
 if(i==2)body=`<div class="mut">${hm(tot().m)} in total${S.staff!="any"?" with "+sf(S.staff).n:""}.</div><div id="list"></div>`;
 if(i==3)body=`<label for="nm">Your name</label><input id="nm" type="text" autocomplete="name" value="${e(S.name)}" placeholder="e.g. Peter Chege"><div class="errmsg" id="e-nm"></div><label for="ph">Phone number</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" value="${e(S.phone)}" placeholder="07XX XXX XXX"><div class="hint">We call or text this number about your booking.</div><div class="errmsg" id="e-ph"></div><label for="nt">Anything we should know? <span class="mut">(optional)</span></label><textarea id="nt" rows="2" placeholder="Reference photo, allergies, running late…">${e(S.note)}</textarea><div class="hint">Your name and number are saved on this device for next time.</div>`;
 if(i==4)body=payBody();
 return`<div class="bk"><div>${stepper(i)}<h1>${h[0]}</h1><p class="sub">${h[1]}</p>${body}</div><aside class="side" id="sum"></aside></div>`}
function payBody(){const p=BIZ.pay,m=S.method,f=fee(),cp=(v)=>`<button class="btn alt" data-copy="${v}">Copy</button>`;
 const b=m=="paybill"?`<div class="sm mut">Paybill number</div><div class="big">${p.paybill.n}${cp(p.paybill.n)}</div><div class="sm mut" style="margin-top:0.571rem">Account number</div><div class="big">${p.paybill.a}${cp(p.paybill.a)}</div>`:`<div class="sm mut">${p[m].l} number</div><div class="big">${p[m].n}${cp(p[m].n)}</div>`;
 return`<h3 class="s" style="margin-top:0">1. Send ${KES(f)} by M-Pesa</h3><div class="chips">${Object.keys(p).map(k=>`<button class="chip" data-m="${k}" aria-pressed="${m==k}">${p[k].l}</button>`).join("")}</div><div class="pay" id="payd">${b}<div class="sm mut" style="margin-top:0.571rem">Name shown: ${BIZ.name}</div></div><h3 class="s">2. Paste the confirmation message</h3><textarea id="msg" rows="4" placeholder="Paste the M-Pesa SMS here">${e(S.msg)}</textarea><div id="parse"></div><div class="sm mut" style="margin:0.571rem 0">No SMS handy? Upload a screenshot instead.</div><input type="file" id="file" accept="image/*" aria-label="Upload payment screenshot"><div class="hint" id="fname">${e(S.file)}</div>`}
function fillList(r){const el=$("#list");if(!el)return;
 if(r=="book-services"){const a=SV.filter(s=>(S.cat=="All"||s.c==S.cat)&&match(s.n+s.d+s.c));
  el.innerHTML=a.length?a.map(s=>{const ok=can(s.id),on=S.lineup.includes(s.id);return`<button class="opt" data-ps="${s.id}" aria-pressed="${on}" ${ok?"":"disabled"}><img class="th2" src="${art(s,0)}" alt=""><span class="g"><b>${s.n}</b><div class="sm mut">${s.c} · ${hm(s.m)}${ok?"":" · not offered by "+sf(S.staff).n}</div></span><b>${KES(s.p)}</b><span class="tick">${CK2}</span></button>`}).join(""):empty("No service matches that.")}
 if(r=="book-team"){const any=S.cat=="All"&&!S.q.trim()?`<button class="opt" data-pt="any" aria-pressed="${S.staff=="any"}"><span class="mo">★</span><span class="g"><b>Anyone free</b><div class="sm mut">The first available specialist. Fastest option.</div></span><span class="tick">${CK2}</span></button>`:"";
  const a=ST.filter(t=>(S.cat=="All"||t.r==S.cat)&&match(t.n+t.r+t.sp+t.o.map(i=>sv(i).n).join(" ")));
  el.innerHTML=any+(a.length?a.map(t=>{const ok=elig(t);return`<button class="opt" data-pt="${t.id}" aria-pressed="${S.staff==t.id}" ${ok?"":"disabled"}><span class="mo">${t.n[0]}</span><span class="g"><b>${t.n}</b> <span class="sm mut">${t.r}</span><div class="sm mut">${ok?"Next free: "+t.nx:"Doesn’t offer every service you picked"}</div></span><span class="tick">${CK2}</span></button>`}).join(""):(any?"":empty("No one matches that.")))}
 if(r=="book-time"){const slot=x=>`<button class="chip" data-time="${x}" aria-pressed="${S.time==x}" ${taken(S.date,x)?"disabled":""}>${fmt(x)}</button>`;
  el.innerHTML=`<h3 class="s">Day</h3><div class="dates">${days.map(d=>`<button class="chip" data-date="${d.k}" aria-pressed="${S.date==d.k}"><div class="sm" style="opacity:.7">${d.w}</div><b>${d.d}</b></button>`).join("")}</div>${S.date?`<h3 class="s">Morning</h3><div class="slots">${times.filter(x=>parseInt(x)<12).map(slot).join("")}</div><h3 class="s">Afternoon</h3><div class="slots">${times.filter(x=>parseInt(x)>=12).map(slot).join("")}</div>`:`<div class="ok">Choose a day to see open times.</div>`}`}}
function sumHTML(){const t=tot(),d=days.find(x=>x.k==S.date);
 return`<div class="tk deep"><div class="sm" style="color:var(--hl);font-weight:600">Your booking</div>${S.lineup.length?S.lineup.map(id=>`<div class="row"><span>${sv(id).n}</span><span class="mut">${KES(sv(id).p)}</span></div>`).join(""):`<p class="mut" style="margin:0.429rem 0 0">Your choices appear here as you go.</p>`}
 ${S.lineup.length?`<hr><div class="row"><span class="mut">With</span><span>${S.staff=="any"?"First free":sf(S.staff).n}</span></div>${d&&S.time?`<div class="row"><span class="mut">When</span><span>${d.w=="Today"?"Today":d.w+" "+d.d}, ${fmt(S.time)}</span></div>`:""}<div class="row"><span class="mut">Duration</span><span>${hm(t.m)}</span></div><hr><div class="row"><b>Total</b><b>${KES(t.p)}</b></div><div class="row"><span class="mut">Fee to pay now (${BIZ.fee}%)</span><span style="color:var(--hl)">${KES(fee())}</span></div>`:""}</div>`}
const okFor=r=>({"book-services":S.lineup.length>0,"book-team":true,"book-time":!!(S.date&&S.time),"book-details":S.name.trim().length>1&&!!norm(S.phone),"book-pay":S.msg.trim().length>15||!!S.file})[r];
function actHTML(r){const i=ORDER.indexOf(r),t=tot(),n=S.lineup.length;
 return`<div class="drawer">${sumHTML()}</div><div class="in2"><button class="sl" data-sumt aria-label="Show booking summary"><span><b>${n?KES(t.p):"No services yet"}</b>${n?` <span class="mut">· ${n} service${n>1?"s":""} · ${hm(t.m)}</span>`:""}</span>${CHEV}</button><div class="acts">${i?`<a class="btn alt bk2" href="#${ORDER[i-1]}" aria-label="Back">${ARW}</a>`:""}<button class="btn" data-next ${okFor(r)?"":"disabled"}>${NEXT[i]}</button></div></div>`}
function upd(){const r=cur;if(!ORDER.includes(r))return;bar();$("#sum")&&($("#sum").innerHTML=sumHTML());$("#act").innerHTML=actHTML(r)}
V.booked=()=>{const d=days.find(x=>x.k==S.date),t=tot();
 return`<div class="dn"><svg class="ring" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34"/><path d="M27 41l9 9 17-19"/></svg><h1>You’re booked in, ${e(S.name.split(" ")[0])}</h1><p class="sub" style="margin:0 auto">${BIZ.name} will confirm your payment, then call or text ${e(S.phone)}.</p><div class="ref rv">${S.ref}</div>
 <div class="tk deep rv" style="--i:1;text-align:left"><div class="sm mut">${d.w=="Today"?"Today":d.w+" "+d.d} at ${fmt(S.time)} · ${hm(t.m)} · with ${S.staff=="any"?"the first free specialist":sf(S.staff).n}</div>${S.lineup.map(id=>`<div class="row"><span>${sv(id).n}</span><span class="mut">${KES(sv(id).p)}</span></div>`).join("")}<hr><div class="row"><span>Fee sent, awaiting confirmation</span><b>${KES(fee())}</b></div></div>
 <div class="tl rv" style="--i:2"><div><span class="n">1</span><span><b>We confirm your payment</b><div class="sm mut">Usually within a few minutes during opening hours.</div></span></div><div><span class="n">2</span><span><b>You get a call or text</b><div class="sm mut">Only if something needs to change.</div></span></div><div><span class="n">3</span><span><b>Come in and relax</b><div class="sm mut">Pay the balance of ${KES(t.p-fee())} at the studio.</div></span></div></div>
 <div class="acts" style="justify-content:center"><a class="btn" href="#home" data-reset>Back to home</a><a class="btn alt" href="#book-services" data-reset>Book another</a></div></div>`};

/* ---------- search + lists ---------- */
function searchList(){const el=$("#list");if(!el)return;const q=S.q.trim().toLowerCase();
 if(!q){el.innerHTML=`<div class="empty">Start typing to search services and people.</div>`;return}
 const a=[...(S.sc!="Team"?SV.filter(s=>(s.n+s.c+s.d).toLowerCase().includes(q)).map(s=>`<a class="opt" href="#svc.${s.id}" style="text-decoration:none"><img class="th2" src="${art(s,0)}" alt=""><span class="g"><b>${s.n}</b><div class="sm mut">Service · ${hm(s.m)}</div></span><b>${KES(s.p)}</b></a>`):[]),...(S.sc!="Services"?ST.filter(t=>(t.n+t.r+t.sp).toLowerCase().includes(q)).map(t=>`<a class="opt" href="#mem.${t.id}" style="text-decoration:none"><span class="mo">${t.n[0]}</span><span class="g"><b>${t.n}</b><div class="sm mut">Team · ${t.r}</div></span></a>`):[])];
 el.innerHTML=a.join("")||empty("Nothing found for “"+e(S.q)+"”.")}
function listFor(r){if(r=="services"){const a=SV.filter(s=>(S.cat=="All"||s.c==S.cat)&&match(s.n+s.d+s.c));$("#list").innerHTML=a.length?a.map(card).join(""):empty("Nothing matches that.")}
 else if(r=="team"){const a=ST.filter(t=>(S.cat=="All"||t.r==S.cat)&&match(t.n+t.r+t.sp+t.o.map(i=>sv(i).n).join(" ")));$("#list").innerHTML=a.length?a.map(tile).join(""):empty("No one matches that.")}
 else if(r=="search")searchList();else fillList(r)}

/* ---------- router ---------- */
let cur=null;const R=()=>location.hash.slice(1)||"home";
const sleep=ms=>new Promise(x=>setTimeout(x,ms));
function guard(r){const i=ORDER.indexOf(r);
 if(i>=1&&!S.lineup.length)return"book-services";
 if(i>=3&&!(S.date&&S.time))return"book-time";
 if(i>=4&&!okFor("book-details"))return"book-details";
 if(r=="booked"&&!S.ref)return"home";return r}
async function route(first){let r=R();const g=guard(r);if(g!==r){history.replaceState(null,"","#"+g);r=g}
 const P=$("#page"),a=ORDER.indexOf(cur),b=ORDER.indexOf(r),dir=a>=0&&b>=0&&b<a?-1:1;P.style.setProperty("--dir",dir);
 if(!first){P.classList.add("out");await sleep(150)}
 cur=r;S.q="";S.cat="All";S.sc="All";if(r=="book-team"&&S.staff!="any"&&!elig(sf(S.staff)))S.staff="any";
 const[base,id]=r.split(".");
 P.innerHTML=ORDER.includes(r)?bookShell(r):(V[base]||V.home)(id);
 document.querySelectorAll(".links a,.mp a").forEach(x=>{const h=x.getAttribute("href").slice(1);x.setAttribute("aria-current",h==base||(h=="services"&&base=="svc")||(h=="team"&&base=="mem")?"page":"false")});
 if($("#list"))listFor(base=="svc"||base=="mem"?"":r);
 closeMenu();document.body.classList.toggle("home",r=="home");navState();
 const bk=ORDER.includes(r);$("#act").hidden=!bk;$("#act").classList.remove("open");document.body.classList.toggle("bkp",bk);if(bk)upd();
 P.classList.remove("out","in");void P.offsetWidth;P.classList.add("in");setTimeout(()=>P.classList.remove("in"),1300);
 scrollTo({top:0});bar()}
function bar(){const n=S.lineup.length;$("#cnt").textContent=n;$("#cnt").classList.toggle("on",n>0);const hide=!n||ORDER.includes(cur)||cur=="booked";$("#bar").classList.toggle("off",hide);
 if(n){$("#barN").textContent=n+(n>1?" services":" service")+(S.staff!="any"?" with "+sf(S.staff).n:"");$("#barP").textContent=KES(tot().p)+" · "+hm(tot().m)}}
function closeMenu(){$("#mp").classList.remove("open");document.documentElement.classList.remove("lock");$("#menu").setAttribute("aria-expanded","false");navState()}
function navState(){$("#nav").classList.toggle("solid",scrollY>8||$("#mp").classList.contains("open"))}
addEventListener("scroll",navState,{passive:true});
let tt;function toast(m){const t=$("#toast");t.innerHTML=CK2.replace("<svg",'<svg class="i"')+m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1400)}
const go=h=>{location.hash=h};
const tg=id=>{const i=S.lineup.indexOf(id);i>-1?S.lineup.splice(i,1):S.lineup.push(id)};
function parse(){const t=S.msg.trim(),el=$("#parse");if(!el)return;if(!t){el.innerHTML="";return}
 const code=(t.match(/\b(?=[A-Z0-9]*\d)(?=[A-Z0-9]*[A-Z])[A-Z0-9]{10}\b/)||[])[0],am=t.match(/(?:Ksh|KES)\.?\s?([\d,]+(?:\.\d+)?)/i),a=am?parseFloat(am[1].replace(/,/g,"")):0;
 el.innerHTML=code&&a>=fee()?`<div class="ok">Found code <b>${code}</b> for ${KES(a)}. Looks good.</div>`:code&&a?`<div class="note">Code ${code} found, but ${KES(a)} is less than the ${KES(fee())} fee. You can still send it and the studio will check.</div>`:`<div class="note">We couldn’t spot a transaction code yet. Paste the full message from M-Pesa.</div>`}

document.addEventListener("click",ev=>{
 if(ev.target.closest("#mp a"))closeMenu();
 const bk=ev.target.closest("[data-book]");
 if(bk){ev.stopPropagation();const id=bk.dataset.book;if(!S.lineup.includes(id))S.lineup.push(id);if(!can(id))S.staff="any";go("book-services");return}
 const nv=ev.target.closest("[data-nav]");const t=ev.target.closest("button,a,[data-nav]");if(!t)return;const D=(nv&&t===nv?nv:t).dataset;
 if(t.id=="menu"){const o=$("#mp").classList.toggle("open");document.documentElement.classList.toggle("lock",o);t.setAttribute("aria-expanded",o);navState()}
 else if(D.nav)go(D.nav);
 else if(D.cat){S.cat=D.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.cat==S.cat));listFor(cur)}
 else if(D.sc){S.sc=D.sc;document.querySelectorAll("[data-sc]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.sc==S.sc));searchList()}
 else if(D.clear!==undefined){S.q="";S.cat="All";const q=$("#pq,#sq");if(q)q.value="";document.querySelectorAll("[data-cat]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.cat=="All"));listFor(cur)}
 else if(D.img!==undefined){document.querySelectorAll(".gal .main img").forEach((x,i)=>x.classList.toggle("on",i==D.img));document.querySelectorAll(".th button").forEach((x,i)=>x.classList.toggle("on",i==D.img))}
 else if(D.tgl){tg(D.tgl);t.textContent=S.lineup.includes(D.tgl)?(cur.startsWith("mem")?"Added ✓":"Added to lineup ✓"):(cur.startsWith("mem")?"Add":"Add to lineup");bar()}
 else if(D.with){S.staff=D.with;S.lineup=S.lineup.filter(can);go("book-services")}
 else if(D.anyone!==undefined){S.staff="any";route(true);}
 else if(D.ps){tg(D.ps);fillList(cur);upd()}
 else if(D.pt){S.staff=D.pt;fillList(cur);upd()}
 else if(D.date){S.date=D.date;if(S.time&&taken(S.date,S.time))S.time=null;fillList(cur);upd()}
 else if(D.time){S.time=D.time;fillList(cur);upd()}
 else if(D.m){S.method=D.m;document.querySelectorAll("[data-m]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.m==S.method));const p=BIZ.pay,m=S.method,cp=v=>`<button class="btn alt" data-copy="${v}">Copy</button>`;$("#payd").innerHTML=(m=="paybill"?`<div class="sm mut">Paybill number</div><div class="big">${p.paybill.n}${cp(p.paybill.n)}</div><div class="sm mut" style="margin-top:0.571rem">Account number</div><div class="big">${p.paybill.a}${cp(p.paybill.a)}</div>`:`<div class="sm mut">${p[m].l} number</div><div class="big">${p[m].n}${cp(p[m].n)}</div>`)+`<div class="sm mut" style="margin-top:0.571rem">Name shown: ${BIZ.name}</div>`}
 else if(D.copy){navigator.clipboard&&navigator.clipboard.writeText(D.copy).then(()=>{t.textContent="Copied";setTimeout(()=>t.textContent="Copy",1200)}).catch(()=>{})}
 else if(D.ct!==undefined){ctPick(+D.ct,t)}
 else if(D.ctback!==undefined){S.ct.step--;ctShow(-1)}
 else if(D.ctsend!==undefined){ctSend()}
 else if(D.ctreset!==undefined){S.ct=ctNew();ctShow(-1)}
 else if(D.sumt!==undefined){$("#act").classList.toggle("open")}
 else if(D.next!==undefined){const i=ORDER.indexOf(cur);toast(WIN[i]);
  if(i==4){S.ref="NS-"+Math.random().toString(36).slice(2,6).toUpperCase();try{localStorage.setItem("guest",JSON.stringify({name:S.name,phone:S.phone}))}catch(x){}setTimeout(()=>go("booked"),380)}
  else setTimeout(()=>go(ORDER[i+1]),380)}
 else if(D.reset!==undefined){S.lineup=[];S.date=S.time=null;S.msg=S.file="";S.staff="any";S.ref=""}
 else if(t.id=="csend"){$("#cok").innerHTML=`<div class="ok">Message sent. We’ll reply on the number you gave.</div>`}
});
document.addEventListener("keydown",ev=>{if(ev.key=="Escape")closeMenu();if(ev.key=="Enter"&&ev.target.dataset&&ev.target.dataset.nav)go(ev.target.dataset.nav)});
document.addEventListener("input",ev=>{const i=ev.target;
 if(i.id=="ctn"||i.id=="ctp"||i.id=="ctm"){S.ct[i.id=="ctn"?"name":i.id=="ctp"?"phone":"msg"]=i.value;const b=$("#ctsend");if(b)b.disabled=!ctOk()}
 if(i.id=="pq"||i.id=="sq"){S.q=i.value;listFor(cur)}
 if(i.id=="nm")S.name=i.value;if(i.id=="ph")S.phone=i.value;if(i.id=="nt")S.note=i.value;
 if(i.id=="msg"){S.msg=i.value;parse()}
 if(ORDER.includes(cur)&&["nm","ph","nt","msg"].includes(i.id))upd()});
document.addEventListener("focusout",ev=>{const i=ev.target;
 if(i.id=="ctp"){$("#e-ctp").textContent=norm(S.ct.phone)?"":"Use a Kenyan number like 0712 345 678."}
 if(i.id=="nm")$("#e-nm").textContent=S.name.trim().length>1?"":"Enter the name we should look for.";
 if(i.id=="ph")$("#e-ph").textContent=norm(S.phone)?"":"Use a Kenyan number like 0712 345 678."});
document.addEventListener("change",ev=>{if(ev.target.id=="file"){S.file=ev.target.files[0]?"Attached: "+ev.target.files[0].name:"";$("#fname").textContent=S.file;upd()}});
window.addEventListener("hashchange",()=>route(false));
route(true);
</script>
</body>
</html>
