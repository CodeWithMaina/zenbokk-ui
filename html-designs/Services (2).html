<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F6F3;--sf:#fff;--ink:#1C1F23;--mut:#5B616B;--ln:#E9E7E2;--hv:#F9F8F5;--sel:#F3F6F3;--okb:#E3F1E8;--okt:#1B5233;--pdb:#FBF1D9;--pdt:#6B4E0B;--ofb:#ECEBE7;--oft:#454A52;--inv:#1C1F23;--invt:#fff;--ac:#2F6B4F;--dg:#A63A2E;--scr:rgba(28,31,35,.4);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{font-size:80%;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--sf:#1D1D1A;--ink:#F2F0EA;--mut:#A29E94;--ln:#2E2D29;--hv:#242421;--sel:#1F2A24;--okb:#1F3326;--okt:#9FD6B2;--pdb:#3A2F14;--pdt:#E8C77A;--ofb:#2A2A27;--oft:#B8B4AA;--inv:#F2F0EA;--invt:#1C1F23;--ac:#5FA583;--dg:#E58B83;--scr:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141412;--sf:#1D1D1A;--ink:#F2F0EA;--mut:#A29E94;--ln:#2E2D29;--hv:#242421;--sel:#1F2A24;--okb:#1F3326;--okt:#9FD6B2;--pdb:#3A2F14;--pdt:#E8C77A;--ofb:#2A2A27;--oft:#B8B4AA;--inv:#F2F0EA;--invt:#1C1F23;--ac:#5FA583;--dg:#E58B83;--scr:rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.4 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1,h2{margin:0}h1{font-size:1.75rem;font-weight:700;letter-spacing:-.02em}h2{font-size:1.05rem;font-weight:700}
svg{flex:none}
.app{max-width:1100px;margin:0 auto;padding:1rem clamp(.9rem,3vw,2rem) 5rem}
.sub{font-size:.85rem;color:var(--mut)}
.in{animation:up .5s cubic-bezier(.2,.7,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(10px)}}@keyframes sl{from{opacity:0;transform:translateX(24px)}}@keyframes sh{from{opacity:0;transform:translateY(40px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* controls */
.btn{min-height:2.6rem;padding:0 1.1rem;border-radius:.8rem;border:1px solid var(--ln);background:var(--sf);font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;transition:opacity .2s,background .2s;white-space:nowrap}
.btn:hover{background:var(--hv)}.btn.pr{background:var(--inv);color:var(--invt);border-color:var(--inv)}.btn.pr:hover{opacity:.9}
.btn.dg{color:var(--dg)}.btn:disabled{opacity:.35;cursor:default}.btn.sq{width:2.6rem;padding:0}
.pill{display:inline-flex;align-items:center;font-size:.78rem;font-weight:500;padding:.2rem .6rem;border-radius:99px;white-space:nowrap}
.pill:before{content:"";width:.4rem;height:.4rem;border-radius:50%;background:currentColor;opacity:.7;margin-right:.35rem}
.ok{background:var(--okb);color:var(--okt)}.pd{background:var(--pdb);color:var(--pdt)}.off{background:var(--ofb);color:var(--oft)}

/* list */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:.2rem 0 1rem;scrollbar-width:none}
.chip{flex:none;min-height:2.3rem;padding:0 .9rem;border-radius:99px;border:1px solid var(--ln);background:var(--sf);font-weight:500;font-size:.85rem}
.chip span{opacity:.6;margin-left:.3rem}.chip.on{background:var(--inv);color:var(--invt);border-color:var(--inv)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.9rem .7rem}
@media (min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(13.5rem,1fr));gap:1.1rem .9rem}}
@media (min-width:960px){.grid{grid-template-columns:repeat(auto-fill,minmax(15rem,1fr))}}
.mc{display:block}
.frame{position:relative;aspect-ratio:4/5;overflow:hidden;border-radius:1.1rem;border:1px solid var(--ln);background:var(--ofb);transition:border-color .2s,transform .2s}
.mc:hover .frame{border-color:var(--mut);transform:translateY(-1px)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.frame.dim img{opacity:.55;filter:saturate(0)}
.tile{position:absolute;inset:0;display:grid;place-items:start center;padding-top:22%;color:var(--mut);font-size:3rem;font-weight:600}
.frame .pill{position:absolute;top:.6rem;left:.6rem;z-index:2}
.glass{position:absolute;left:.5rem;right:.5rem;bottom:.5rem;padding:.65rem .8rem .6rem;border-radius:.8rem;background:color-mix(in srgb,var(--sf) 92%,transparent);color:var(--ink)}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){.glass{background:color-mix(in srgb,var(--sf) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}}
@media (min-width:600px){.glass{left:.65rem;right:.65rem;bottom:.65rem;padding:.8rem .95rem .7rem}}
.nm{margin:0;font-size:.98rem;font-weight:700;line-height:1.2;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (min-width:600px){.nm{font-size:1.08rem}}
.mc:hover .nm,.mc:focus-visible .nm{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.mt{display:flex;justify-content:space-between;gap:.5rem;margin:.5rem 0 0;padding-top:.5rem;border-top:1px solid var(--ln);font-size:.8rem;color:var(--mut)}.mt b{color:var(--ink);font-weight:700}
.empty{padding:3rem 1rem;text-align:center;color:var(--mut)}.empty .btn{margin-top:1rem}

/* detail */
.back{display:inline-flex;align-items:center;gap:.3rem;min-height:2.4rem;font-weight:500;color:var(--mut);margin-bottom:.4rem}.back:hover{color:var(--ink)}
.layout{display:grid;gap:1.4rem}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:3rem}.info{position:sticky;top:1.5rem;align-self:start}}
.gallery{margin:0 calc(-1*clamp(.9rem,3vw,2rem))}
@media (min-width:900px){.gallery{margin:0}}
.main{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--ofb)}
@media (min-width:900px){.main{border-radius:1.1rem;border:1px solid var(--ln)}}
.track{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.track img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;display:block}
.ind{position:absolute;top:.9rem;left:1rem;right:1rem;display:flex;gap:.25rem;pointer-events:none}
.ind i{flex:1;height:2px;background:rgba(255,255,255,.5);transition:background .2s}.ind i.on{background:#fff}
.nav{position:absolute;top:calc(50% - 1.4rem);width:2.2rem;height:2.8rem;border:0;border-radius:.7rem;background:rgba(255,255,255,.9);color:#1C1F23;display:none;place-items:center;padding:0;opacity:0;transition:opacity .2s}
.nav.p{left:.7rem}.nav.n{right:.7rem}
@media (hover:hover){.nav{display:grid}.main:hover .nav{opacity:1}}
.thumbs{display:none}
@media (min-width:900px){.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.5rem}}
.thumbs button{padding:0;border:1px solid var(--ln);background:var(--ofb);aspect-ratio:1;border-radius:.8rem;overflow:hidden;opacity:.55;transition:opacity .2s}
.thumbs button.on,.thumbs button:hover{opacity:1}.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.info .pill{margin-bottom:.6rem}.info h1{margin-bottom:1rem}
.cd{background:var(--sf);border:1px solid var(--ln);border-radius:1.1rem;padding:1.1rem}
.dr{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--ln)}.dr:first-child{padding-top:0}.dr:last-child{border:0;padding-bottom:0}.dr span{color:var(--mut)}.dr b{font-weight:600;text-align:right}
.desc{color:var(--mut);line-height:1.6;margin:1rem 0 0;max-width:46ch}
.acts{display:flex;gap:.6rem;margin-top:1.2rem}.acts .bk{flex:1}
.hint{margin:.8rem 0 0;font-size:.85rem;color:var(--mut)}
.menu{position:relative}
.mlist{position:absolute;right:0;top:calc(100% + .4rem);z-index:20;min-width:14rem;padding:.35rem;border:1px solid var(--ln);border-radius:.9rem;background:var(--sf);box-shadow:0 18px 34px -24px rgba(0,0,0,.45)}
.mi{display:flex;align-items:center;gap:.65rem;width:100%;min-height:2.6rem;padding:0 .75rem;border:0;border-radius:.6rem;background:none;text-align:left;font-weight:500;font-size:.92rem}
.mi:hover{background:var(--hv)}.mi.dg{color:var(--dg)}.mi svg{color:var(--mut)}.mi.dg svg{color:var(--dg)}
.mi.sep{margin-top:.3rem;border-top:1px solid var(--ln);border-radius:0 0 .6rem .6rem}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem clamp(.9rem,3vw,2rem) calc(.7rem + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}
.bbar b{display:block;font-size:1.1rem}
@media (min-width:900px){.bbar{display:none}}
@media (max-width:899px){.acts .bk{display:none}.acts .btn:not(.sq){flex:1}}
@media (max-width:640px){h1{font-size:1.5rem}}

/* form */
.fgrid{display:grid;gap:1.4rem}
@media (min-width:960px){.fgrid{grid-template-columns:minmax(0,36rem) 17rem;gap:2.4rem;align-items:start}.fprev{position:sticky;top:1.5rem}}
.fprev{display:none}@media (min-width:960px){.fprev{display:block}}
.field{margin-bottom:1.2rem}
.fl{display:block;font-weight:600;font-size:.85rem;margin-bottom:.4rem}
.fl em{font-style:normal;font-weight:400;color:var(--mut)}
input[type=text],input[type=number],textarea{display:block;width:100%;min-height:2.7rem;padding:0 .8rem;border:1px solid var(--ln);border-radius:.8rem;background:var(--sf);font-size:16px;font-weight:400;outline:0}
textarea{min-height:6rem;padding:.7rem .8rem;resize:vertical;line-height:1.4}
input:focus,textarea:focus{border-color:var(--ink)}input.bad{border-color:var(--dg)}
.err{display:none;margin:.35rem 0 0;font-size:.82rem;color:var(--dg)}.bad+.err,.pre.bad+.err{display:block}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.pre{position:relative}.pre span{position:absolute;left:.8rem;top:50%;transform:translateY(-50%);font-size:.85rem;color:var(--mut);pointer-events:none}.pre input{padding-left:3rem}
.qc{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
.qc button{min-height:2rem;padding:0 .7rem;border:1px solid var(--ln);border-radius:99px;background:var(--sf);font-size:.8rem;font-weight:500;color:var(--mut)}
.qc button.on{background:var(--inv);color:var(--invt);border-color:var(--inv)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.slotp{position:relative;aspect-ratio:4/5;border:1px dashed var(--mut);border-radius:.9rem;background:none;overflow:hidden;display:grid;place-items:center;color:var(--mut);font-size:.85rem;font-weight:600;padding:0}
.slotp:hover{background:var(--hv)}.slotp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slotp .x{position:absolute;top:.4rem;right:.4rem;z-index:2;width:1.9rem;height:1.9rem;border:0;border-radius:.6rem;background:rgba(255,255,255,.92);color:#1C1F23;display:grid;place-items:center;padding:0}
.op{position:relative;display:flex;justify-content:space-between;align-items:center;gap:.6rem;width:100%;padding:.7rem .9rem;border:1px solid var(--ln);border-radius:.9rem;background:var(--sf);cursor:pointer}
.op:has(input:checked){border-color:var(--ac);background:var(--sel)}
.op input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}.op b{display:block;font-size:.95rem}
.ck{width:1.3rem;height:1.3rem;border-radius:.4rem;border:1.5px solid var(--mut);display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.op input:checked~.ck{background:var(--ac);border-color:var(--ac);color:var(--invt)}
.op input:focus-visible~.ck{outline:2px solid var(--ac);outline-offset:2px}
.two{display:flex;gap:.6rem;margin-top:1.2rem}.two .btn{flex:1}
@media (min-width:600px){.two .btn{flex:none}}
@media (max-width:599px){.two{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:20;padding:.7rem clamp(.9rem,3vw,2rem) calc(.7rem + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}}

/* layers: drawer (booking), dialog, action sheet */
.scr{position:fixed;inset:0;border:0;background:var(--scr);z-index:40;animation:up .3s}
.sheet,.dlg{position:fixed;background:var(--sf);display:flex;flex-direction:column;z-index:41}
.sheet{top:0;right:0;bottom:0;width:min(30rem,100%);border-left:1px solid var(--ln);animation:sl .4s cubic-bezier(.2,.7,.2,1)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--ln)}
.sb{flex:1;overflow:auto;padding:1rem 1.2rem}
.sf{padding:.9rem 1.2rem calc(.9rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);display:flex;justify-content:space-between;align-items:center;gap:.8rem}.sf>div:first-child{display:flex;flex-direction:column}
.ico{width:2.5rem;height:2.5rem;border:0;background:none;border-radius:.7rem;display:flex;align-items:center;justify-content:center;color:var(--mut)}.ico:hover{background:var(--hv)}
.gl{font-size:.82rem;font-weight:600;margin:.2rem 0 .55rem}
.ds{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.4rem;scrollbar-width:none;margin-bottom:.9rem}
.dy{flex:none;width:3.9rem;min-height:4.3rem;border-radius:.9rem;border:1px solid var(--ln);background:var(--sf);display:flex;flex-direction:column;align-items:center;justify-content:center}
.dy:disabled{opacity:.35}.sb .op{margin-bottom:.5rem}.chips.sm{padding:0 0 .9rem}.dy b{font-size:1.2rem}.dy span{font-size:.72rem;color:var(--mut)}.dy.on{background:var(--inv);color:var(--invt);border-color:var(--inv)}.dy.on span{color:inherit;opacity:.75}
.ts{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.6rem,1fr));gap:.5rem;margin-bottom:1.1rem}
.tm{min-height:2.6rem;border-radius:.8rem;border:1px solid var(--ln);background:var(--sf);font-weight:500;font-size:.9rem}.tm.on{background:var(--inv);color:var(--invt);border-color:var(--inv)}.tm:disabled{opacity:.35;text-decoration:line-through}
.dlg{left:50%;top:50%;width:min(26rem,calc(100% - 2rem));transform:translate(-50%,-50%);border:1px solid var(--ln);border-radius:1.3rem;padding:1.4rem;animation:up .3s cubic-bezier(.2,.7,.2,1)}
.dlg h2{font-size:1.2rem;margin-bottom:.4rem}.dlg p{margin:0 0 1.2rem}
.dlg .two{margin-top:0}
.grab{display:none;width:2.6rem;height:.28rem;border-radius:99px;background:var(--ln);margin:0 auto .8rem}
.alist{display:flex;flex-direction:column}
.ar{display:flex;align-items:center;gap:.9rem;min-height:3.6rem;padding:0 .3rem;border:0;border-bottom:1px solid var(--ln);background:none;text-align:left;font-weight:600;font-size:1rem}
.ar:last-child{border-bottom:0}.ar svg{color:var(--mut)}.ar.dg,.ar.dg svg{color:var(--dg)}
.ahead{padding:.2rem .3rem .9rem}.ahead b{display:block;font-size:1.05rem}
@media (max-width:640px){
.sheet,.dlg{top:auto;left:0;right:0;bottom:0;width:auto;transform:none;border:0;border-radius:1.5rem 1.5rem 0 0;animation-name:sh}
.sheet{height:92dvh;height:92vh}
.dlg{padding:.8rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom,0px))}
.grab{display:block}.dlg .two{flex-direction:column-reverse}
.dlg .two .btn{min-height:3rem}}

.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);display:flex;gap:1rem;align-items:center;background:var(--inv);color:var(--invt);padding:.8rem 1.2rem;border-radius:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:calc(100% - 2rem)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0}
@media (max-width:899px){body.hasbar .toast{bottom:calc(5rem + env(safe-area-inset-bottom,0px))}}

/* toolbar, search, segmented control, avatars (from the customer module) */
.bar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:.4rem}
.se{flex:1 1 220px;display:flex;align-items:center;gap:.55rem;min-height:2.6rem;padding:0 .9rem;border:1px solid var(--ln);border-radius:.8rem;background:var(--sf);color:var(--mut)}.se:focus-within{border-color:var(--ink)}
.se input{border:0;outline:0;background:none;flex:1;min-width:0;width:auto;min-height:0;padding:0;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none}
.seg{display:flex;background:var(--hv);border:1px solid var(--ln);border-radius:.8rem;padding:.2rem}.seg button{border:0;background:none;min-height:2.1rem;padding:0 .9rem;border-radius:.6rem;font-weight:600;font-size:.85rem;color:var(--mut)}.seg .on{background:var(--sf);color:var(--ink);box-shadow:0 0 0 1px var(--ln),0 2px 6px -2px rgba(0,0,0,.15)}
.top .tools{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lnk{background:none;border:0;padding:.4rem 0;color:var(--ac);font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:.2rem}
.row{display:flex;align-items:center}.nm2{font-weight:600}
.av{border-radius:50%;background:var(--av);color:var(--avt);font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none;width:2.9rem;height:2.9rem;font-size:1rem}.av.t1{background:#ECE9E2;color:#3B3F46}.av.t2{background:#F0E7DD;color:#6A4B2A}
.bd{min-width:1.3rem;height:1.3rem;padding:0 .35rem;border-radius:99px;background:var(--inv);color:var(--invt);font-size:.72rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.btn[aria-expanded="true"]{background:var(--hv);border-color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:.35rem}
.rc{display:flex;justify-content:space-between;align-items:center;gap:1rem}
button.op{text-align:left}.op.on{border-color:var(--ac);background:var(--sel)}.op .sub{display:block}

/* filter drawer (right): pushes the cards on wide screens, overlays on phones and tablets */
.lay{display:flex;align-items:flex-start}
.rs{flex:1;min-width:0}
.fd{position:sticky;top:1rem;flex:none;width:0;margin-left:0;overflow:hidden;display:flex;justify-content:flex-end;opacity:0;visibility:hidden;transition:width .45s cubic-bezier(.2,.7,.2,1),margin .45s cubic-bezier(.2,.7,.2,1),opacity .3s ease,visibility 0s linear .45s}
.lay.open .fd{width:18rem;margin-left:1.1rem;opacity:1;visibility:visible;transition-delay:0s}
.fdi{width:18rem;flex:none;display:flex;flex-direction:column;max-height:calc(100dvh - 2rem);background:var(--sf);border:1px solid var(--ln);border-radius:1.1rem;overflow:hidden}
.fdi .sb{padding:1rem 1.1rem}.fdi .sh,.fdi .sf{padding-left:1.1rem;padding-right:1.1rem}
.fdi .sf{flex-direction:row}
.fs{display:none}
.fdi .chips{flex-wrap:wrap;overflow:visible;padding:0 0 .2rem}
.fdi .seg{margin-bottom:.2rem}.fdi .seg button{flex:1;padding:0 .4rem}
@media (max-width:899px){
 .fd{position:fixed;top:0;bottom:0;right:0;left:auto;width:min(21rem,88%)!important;margin:0!important;opacity:1;visibility:hidden;transform:translateX(104%);transition:transform .4s cubic-bezier(.2,.7,.2,1),visibility 0s linear .4s;z-index:41}
 .lay.open .fd{transform:none;visibility:visible;transition-delay:0s}
 .fdi{width:100%;height:100%;max-height:none;border:0;border-radius:1.5rem 0 0 1.5rem}
 .fdi .sh{padding-top:calc(1rem + env(safe-area-inset-top,0px))}
 .fs{display:block;position:fixed;inset:0;border:0;background:var(--scr);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s ease}
 .lay.open .fs{opacity:1;pointer-events:auto}}
@media (prefers-reduced-motion:reduce){.fd,.fs{transition:none!important}}
</style>
</head>

 for(let i=0;i<30;i++){const x=r()*520-60,a=(r()-.5)*170,b=(r()-.5)*170,d=(r()-.5)*130;h+=`<path d="M${x} -30 C${x+a} 150 ${x+b} 320 ${x+d} 540" stroke="${pal.h}" stroke-width="${1+r()*2}" stroke-opacity="${.12+r()*.28}" fill="none"/>`}
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice"><defs><filter id="b"><feGaussianBlur stdDeviation="1.6"/></filter><radialGradient id="l" cx=".3" cy=".22" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="400" height="500" fill="${pal.bg}"/><g filter="url(#b)">${p}</g>${h}<rect width="400" height="500" fill="url(#l)"/></svg>`;

/* ---------- icons ---------- */
const svg=(p,w=18)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={search:svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>'),sliders:svg('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'),x13:svg('<path d="M6 6l12 12M18 6L6 18"/>',13),back:svg('<path d="M15 6l-6 6 6 6"/>',16),chev:svg('<path d="M9 6l6 6-6 6"/>',16),prev:svg('<path d="M15 6l-6 6 6 6"/>',16),plus:svg('<path d="M12 5v14M5 12h14"/>'),x:svg('<path d="M6 6l12 12M18 6L6 18"/>'),more:svg('<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>',20),
 cal:svg('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>'),edit:svg('<path d="M4 20h4L19 9l-4-4L4 16z"/>'),pause:svg('<path d="M9 5v14M15 5v14"/>'),play:svg('<path d="M7 4l12 8-12 8z"/>'),
 archive:svg('<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 001 1h12a1 1 0 001-1V9M10 13h4"/>'),restore:svg('<path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/>'),trash:svg('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 001 1h8a1 1 0 001-1l1-12M9 7V4h6v3"/>'),ck:svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>',13)};

/* ---------- data ---------- */
const seed=[['Creative Colour','Full-head global colour with premium gloss.',120,5200,'active'],['Signature Cut & Finish','Consultation, precision cut and blow-dry.',60,3200,'active'],['Gloss Treatment','A glass-like shine treatment for tired colour.',45,2400,'active'],['Bridal Trial','A full run-through of your wedding-day look.',90,7500,'paused'],['Scalp Ritual','Massage, cleanse and nourish.',30,1800,'active'],['Keratin Smoothing','Long-lasting frizz control.',150,9500,'archived']];

const find=id=>S.find(s=>s.id===id);

/* ---------- ui helpers ---------- */
function toast(msg,undo){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Undo</button>':''}`;t.classList.add('on');if(undo)$('button',t).onclick=()=>{undo();t.classList.remove('on')};clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),4500)}
function layer(cls,html){const o=document.createElement('div');o.innerHTML=`<button class="scr" aria-label="Close" tabindex="-1"></button><div class="${cls}" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(o);document.body.style.overflow='hidden';
 const k=e=>e.key==='Escape'&&close();const close=()=>{o.remove();document.body.style.overflow='';document.removeEventListener('keydown',k)};
 document.addEventListener('keydown',k);$('.scr',o).onclick=close;$$('[data-close]',o).forEach(b=>b.onclick=close);return{el:o.lastChild,close}}

/* ---------- list, search and filter drawer ---------- */
const F={q:'',status:['active','paused'],min:'',max:'',dur:[],show:'all',sort:'new',open:false};
const DEF_ST=['active','paused'];
const DUR=[['Up to 30 min',0,30],['31–60 min',31,60],['61–90 min',61,90],['Over 90 min',91,1e6]];
const PRE=[['Under 2,500','',2500],['2,500 – 5,000',2500,5000],['5,000 and over',5000,'']];
const SORT=[['new','Newest'],['az','Name A–Z'],['pl','Price: low to high'],['ph','Price: high to low'],['dl','Shortest first']];
const cap=t=>t[0].toUpperCase()+t.slice(1);
const same=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const pool=()=>V===null?S:S.filter(s=>s.status==='active'&&s.show);
function filtered(){
 const q=F.q.trim().toLowerCase().replace(/\s/g,'');
 const L=pool().filter(s=>(V!==null||F.status.includes(s.status))&&(!q||(s.name+s.description).toLowerCase().replace(/\s/g,'').includes(q))&&(F.min===''||s.price>=+F.min)&&(F.max===''||s.price<=+F.max)&&(!F.dur.length||F.dur.some(i=>s.min>=DUR[i][1]&&s.min<=DUR[i][2]))&&(V!==null||F.show==='all'||(F.show==='visible')===s.show));
 const o={az:(a,b)=>a.name.localeCompare(b.name),pl:(a,b)=>a.price-b.price,ph:(a,b)=>b.price-a.price,dl:(a,b)=>a.min-b.min};
 return o[F.sort]?L.sort(o[F.sort]):L}

 if(V===null&&!same(F.status,DEF_ST))a.push(['status','Status: '+(F.status.length?F.status.map(cap).join(', '):'None')]);
 if(F.min!==''||F.max!=='')a.push(['price','Price: '+(F.min!==''?money(F.min):'Any')+' – '+(F.max!==''?money(F.max):'Any')]);

function results(){
 const L=filtered(),ch=applied(),n=pool().length;
 $('#cnt').textContent=`${L.length} of ${n} services`;
 $('#ac').innerHTML=ch.map(c=>`<button class="chip on" data-r="${c[0]}" aria-label="Remove filter ${esc(c[1])}">${esc(c[1])}${I.x13}</button>`).join('')+(ch.length?'<button class="lnk" data-f="fr">Clear all</button>':'');

 $('#res').innerHTML=L.length?`<div class="grid">${L.map(s=>cardHTML(s,'#/s/'+s.id)).join('')}</div>`:`<div class="empty">No services match your search or filters.${ch.length||F.q?'<br><button class="btn" style="margin-top:1rem" data-f="fr" data-clear="1">Clear search and filters</button>':''}</div>`}
function drawerBody(){
 const c=st=>S.filter(s=>s.status===st).length;
 return `${V===null?`<p class="gl">Status</p>${['active','paused','archived'].map(st=>`<label class="op"><span><b>${cap(st)}</b><span class="sub">${c(st)} service${c(st)===1?'':'s'}</span></span><input type="checkbox" data-st="${st}" ${F.status.includes(st)?'checked':''}><i class="ck">${I.ck}</i></label>`).join('')}`:''}
 <p class="gl" style="margin-top:${V===null?'1rem':'.2rem'}">Price (KES)</p>
 <div class="row2"><div><label class="fl" for="pmin">Min</label><input id="pmin" type="number" inputmode="numeric" min="0" step="100" placeholder="0" value="${F.min}"></div><div><label class="fl" for="pmax">Max</label><input id="pmax" type="number" inputmode="numeric" min="0" step="100" placeholder="Any" value="${F.max}"></div></div>
 <div class="qc" style="margin-bottom:1rem">${PRE.map((p,i)=>`<button type="button" class="${String(F.min)===String(p[1])&&String(F.max)===String(p[2])?'on':''}" data-f="pre" data-v="${i}">${p[0]}</button>`).join('')}</div>
 <p class="gl">Duration</p><div class="chips">${DUR.map((d,i)=>`<button class="chip ${F.dur.includes(i)?'on':''}" data-f="dur" data-v="${i}" aria-pressed="${F.dur.includes(i)}">${d[0]}</button>`).join('')}</div>
 ${V===null?`<p class="gl" style="margin-top:.8rem">Storefront</p><div class="seg" role="group" aria-label="Storefront visibility">${['all','visible','hidden'].map(v=>`<button class="${F.show===v?'on':''}" data-f="show" data-v="${v}">${cap(v)}</button>`).join('')}</div>`:''}
 <p class="gl" style="margin-top:.8rem">Sort by</p><div class="chips">${SORT.map(s=>`<button class="chip ${F.sort===s[0]?'on':''}" data-f="sort" data-v="${s[0]}" aria-pressed="${F.sort===s[0]}">${s[1]}</button>`).join('')}</div>`}
const redrawDrawer=()=>{$('#fdb').innerHTML=drawerBody()};
function list(){

 <div class="tools"><a class="btn pr staff" href="#/new">${I.plus}New service</a></div></div>
 <div class="lay ${F.open?'open':''}"><button class="fs" data-f="fx" aria-label="Close filters" tabindex="-1"></button>
 
 <div class="rs"><div class="bar"><label class="se">${I.search}<input id="q" type="search" placeholder="Search services" aria-label="Search services" value="${esc(F.q)}" autocomplete="off"></label><button class="btn" id="ft" data-f="ft" aria-expanded="${F.open}" aria-controls="fd">${I.sliders}Filters<span class="bd" id="fbd"></span></button></div>
 <div class="chips" id="ac"></div><div class="sub" id="cnt" style="margin:.2rem 0 .9rem"></div><div id="res"></div></div><aside class="fd" id="fd" aria-label="Filters" aria-hidden="${!F.open}"><div class="fdi"><div class="sh"><div><div class="nm2" style="font-size:1.15rem">Filters</div><div class="sub" id="fc">Narrow your services</div></div><button class="ico" data-f="fx" aria-label="Close filters">${I.x}</button></div><div class="sb" id="fdb">${drawerBody()}</div><div class="sf"><button class="lnk" data-f="fr">Reset</button><button class="btn pr" data-f="fx" id="fshow">Show</button></div></div></aside></div>`;
 results();lock();
}
document.addEventListener('click',e=>{
 const r=e.target.closest('[data-r]');
 if(r){const k=r.dataset.r;if(k==='status')F.status=[...DEF_ST];else if(k==='price')F.min=F.max='';else if(k==='show')F.show='all';else if(k.startsWith('dur'))F.dur=F.dur.filter(i=>i!==+k.slice(3));redrawDrawer();results();return}
 const t=e.target.closest('[data-f]');if(!t)return;const a=t.dataset.f,v=t.dataset.v;
 if(a==='ft')setDrawer(!F.open);else if(a==='fx')setDrawer(false);
 else if(a==='fr'){resetFilters();if(t.dataset.clear){F.q='';const q=$('#q');if(q)q.value=''}redrawDrawer();results()}
 else if(a==='pre'){const p=PRE[+v],on=String(F.min)===String(p[1])&&String(F.max)===String(p[2]);F.min=on?'':p[1];F.max=on?'':p[2];redrawDrawer();results()}
 else if(a==='dur'){const i=+v;F.dur=F.dur.includes(i)?F.dur.filter(x=>x!==i):[...F.dur,i];redrawDrawer();results()}
 else if(a==='show'){F.show=v;redrawDrawer();results()}
 else if(a==='sort'){F.sort=v;redrawDrawer();results()}
});
document.addEventListener('change',e=>{const st=e.target.dataset.st;if(!st)return;F.status=e.target.checked?[...F.status,st]:F.status.filter(x=>x!==st);results()});
document.addEventListener('input',e=>{const i=e.target.id;if(i==='q'){F.q=e.target.value;results()}else if(i==='pmin'||i==='pmax'){F[i==='pmin'?'min':'max']=e.target.value;results()}});

/* ---------- detail ---------- */
const rows=s=>[s.status==='active'&&['pause','Pause service',I.pause],s.status==='paused'&&['resume','Resume service',I.play],s.status==='archived'?['restore','Restore from archive',I.restore]:['archive','Archive service',I.archive],['delete','Delete service',I.trash,1]].filter(Boolean);
function runAction(id,a){

function detail(id){

 app.innerHTML=`<a class="back" href="#/">${I.back}Services</a><div class="layout">

 ${s.imgs.length>1?`<div class="thumbs">${s.imgs.map((u,i)=>`<button class="${i?'on':''}" aria-label="Photo ${i+1}"><img alt="" src="${u}"></button>`).join('')}</div>`:''}</div>

 ${s.description?`<p class="desc">${esc(s.description)}</p>`:''}
 <div class="acts"><button class="btn pr bk" id="book" ${can?'':'disabled'}>${I.cal}Book now</button><a class="btn" href="#/edit/${s.id}">${I.edit}Edit</a>

 ${can?'':`<p class="hint">${s.status==='paused'?'Paused services can’t be booked. Resume it to take bookings.':'Archived services are hidden everywhere. Restore it to take bookings.'}</p>`}</div></div>
 <div class="bbar"><div><b>${price(s.price)}</b><span class="sub">${dur(s.min)}</span></div><button class="btn pr" id="book2" ${can?'':'disabled'}>${I.cal}Book now</button></div>`;
 const tr=$('#track');
 if(tr&&s.imgs.length>1){const dots=$$('.ind i'),tb=$$('.thumbs button');
  tr.onscroll=()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);dots.forEach((d,j)=>d.classList.toggle('on',j===i));tb.forEach((b,j)=>b.classList.toggle('on',j===i))};

 $('#book').onclick=$('#book2').onclick=()=>book(id);

   $$('[data-a]',L.el).forEach(b=>b.onclick=()=>{L.close();runAction(id,b.dataset.a)});return}
  ml.hidden=!ml.hidden;mb.setAttribute('aria-expanded',!ml.hidden);if(!ml.hidden)document.addEventListener('click',closeMenu,{once:true})};
 $$('[data-a]',ml).forEach(b=>b.onclick=()=>{closeMenu();runAction(id,b.dataset.a)});
}

 $('#yes',L.el).onclick=()=>{S=S.filter(x=>x.id!==id);L.close();location.hash='#/';toast('Service deleted')}}

/* ---------- booking (same as the customer module: drawer on wide screens, sheet on phones) ---------- */
const hm=m=>(Math.floor(m/60)%12||12)+':'+String(m%60).padStart(2,'0')+' '+(m<720?'AM':'PM');
const MEM=[['Diana Achieng','+254 711 300 001','Active'],['Brian Kiptoo','+254 722 410 118','Active'],['Amina Hassan','+254 733 205 774','Inactive'],['Wanjiru Mwangi','+254 700 118 920','Active'],['Kevin Otieno','+254 712 884 051','Pending'],['Faith Chebet','+254 745 602 339','Active']].map((a,i)=>({id:i,n:a[0],p:a[1],s:a[2],ini:a[0].split(' ').map(x=>x[0]).join(''),t:i%3}));
const avt=m=>`<span class="av t${m.t}" aria-hidden="true">${m.ini}</span>`;
const mp=s=>`<span class="pill ${s==='Active'?'ok':s==='Pending'?'pd':'off'}">${s}</span>`;
function book(id){
 const act=S.filter(x=>x.status==='active');
 const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+i);return d});
 const B={sv:[id],d:null,t:null,c:V,nw:false,q:''};
 const L=layer('sheet',`<div class="sh"><div><div class="nm2" style="font-size:1.15rem">Book appointment</div><div class="sub" id="hs"></div></div><button class="ico" data-close aria-label="Close">${I.x}</button></div>
 <div class="sb">${V===null?'<p class="gl">Customer</p><div id="cu" style="margin-bottom:1rem"></div>':''}<p class="gl">Services</p><div id="sv">${act.map(x=>`<label class="op"><span><b>${esc(x.name)}</b><span class="sub">${dur(x.min)} · ${price(x.price)}</span></span><input type="checkbox" value="${x.id}" ${x.id===id?'checked':''}><i class="ck">${I.ck}</i></label>`).join('')}</div>
 <p class="gl" style="margin-top:1rem">Date</p><div class="ds">${days.map((d,i)=>`<button class="dy" data-d="${i}" ${d.getDay()===0?'disabled':''}><span>${d.toLocaleDateString('en-GB',{weekday:'short'})}</span><b>${d.getDate()}</b><span>${d.toLocaleDateString('en-GB',{month:'short'})}</span></button>`).join('')}</div><div id="tw"></div></div>
 <div class="sf"><div id="tt"></div><button class="btn pr" id="ok" disabled>Confirm booking</button></div>`),el=L.el;
 const sel=()=>B.sv.map(find),du=()=>sel().reduce((s,x)=>s+x.min,0),tot=()=>sel().reduce((s,x)=>s+(+x.price),0);
 const custOK=()=>B.c!==null||(B.nw&&$('#nn',el)&&$('#nn',el).value.trim());
 const foot=()=>{$('#hs',el).textContent=B.c!==null?MEM[B.c].n:(B.nw&&$('#nn',el)&&$('#nn',el).value.trim())||'Choose a customer';
  $('#tt',el).innerHTML=B.sv.length?`<b>${price(tot())}</b><span class="sub">${dur(du())}</span>`:'<span class="sub">Choose a service</span>';
  $('#ok',el).disabled=!(B.sv.length&&B.d!==null&&B.t!==null&&custOK())};
 const times=()=>{const w=$('#tw',el);if(B.d===null){w.innerHTML='<p class="sub">Pick a day to see start times.</p>';return}
  let x='<p class="gl">Start time</p><div class="ts">';for(let m=540,k=0;m<=1020;m+=30,k++)x+=`<button class="tm ${B.t===m?'on':''}" data-m="${m}" ${(m+du()>1080||(B.d*7+k*3)%5===0)?'disabled':''}>${hm(m)}</button>`;
  w.innerHTML=x+'</div>';$$('.tm',el).forEach(b=>b.onclick=()=>{B.t=+b.dataset.m;times();foot()})};
 const results=()=>{const q=B.q.toLowerCase().replace(/\s/g,''),r=MEM.filter(m=>!q||(m.n+m.p).toLowerCase().replace(/\s/g,'').includes(q)).slice(0,4);
  $('#cr',el).innerHTML=r.length?r.map(m=>`<button type="button" class="op" data-m="${m.id}"><span class="row" style="gap:.7rem">${avt(m)}<span><b>${m.n}</b><span class="sub">${m.p}</span></span></span>${mp(m.s)}</button>`).join(''):'<p class="sub">No customers match.</p>';
  $$('[data-m]',el).forEach(b=>b.onclick=()=>{B.c=+b.dataset.m;cu();foot()})};
 const cu=()=>{const w=$('#cu',el);if(!w)return;
  if(B.c!==null){const m=MEM[B.c];w.innerHTML=`<div class="op on"><span class="row" style="gap:.7rem">${avt(m)}<span><b>${m.n}</b><span class="sub">${m.p}</span></span></span><button type="button" class="lnk" id="chg">Change</button></div>`;$('#chg',el).onclick=()=>{B.c=null;B.q='';cu();foot()};return}
  if(B.nw){w.innerHTML=`<label class="fl" for="nn">Name</label><input id="nn" type="text" autocomplete="off" style="margin-bottom:.8rem"><label class="fl" for="np">Phone</label><input id="np" type="text" inputmode="tel" placeholder="+254 7…"><button type="button" class="lnk" id="srch">Search existing customers</button>`;
   $('#nn',el).oninput=foot;$('#srch',el).onclick=()=>{B.nw=false;cu();foot()};$('#nn',el).focus();return}
  w.innerHTML=`<label class="se">${I.search}<input id="cq" type="search" placeholder="Search name or phone" aria-label="Search customers" value="${esc(B.q)}" autocomplete="off"></label><div id="cr" style="margin-top:.6rem"></div><button type="button" class="lnk" id="nwb">${I.plus}New customer</button>`;
  results();$('#cq',el).oninput=e=>{B.q=e.target.value;results()};$('#nwb',el).onclick=()=>{B.nw=true;cu();foot()}};
 $$('#sv input',el).forEach(i=>i.onchange=()=>{B.sv=$$('#sv input:checked',el).map(x=>x.value);B.t=null;times();foot()});
 $$('.dy',el).forEach(b=>b.onclick=()=>{B.d=+b.dataset.d;B.t=null;$$('.dy',el).forEach(x=>x.classList.toggle('on',x===b));times();foot()});
 $('#ok',el).onclick=()=>{L.close();toast('Appointment booked')};
 cu();times();foot();
}

/* ---------- create / edit ---------- */
function form(id){
 const editing=id?find(id):null;
 const d=editing?{...editing,imgs:[...editing.imgs]}:{name:'',description:'',min:60,price:'',show:true,imgs:[]};
 const back=editing?'#/s/'+id:'#/';
 app.innerHTML=`<a class="back" href="${back}">${I.back}${editing?'Back to service':'Services'}</a><div class="top"><h1>${editing?'Edit service':'New service'}</h1></div>
 <div class="fgrid"><form class="cd" id="f" novalidate>
 <div class="field"><span class="fl">Photos <em>· up to 3, the first is the cover</em></span><div class="photos" id="ph"></div><input id="file" type="file" accept="image/*" hidden></div>
 <div class="field"><label class="fl" for="n">Name</label><input id="n" type="text" value="${esc(d.name)}" maxlength="60" autocomplete="off"><p class="err">Give the service a name.</p></div>
 <div class="field"><label class="fl" for="ds">Description <em>(optional)</em></label><textarea id="ds" maxlength="240">${esc(d.description)}</textarea></div>
 <div class="row2"><div class="field"><label class="fl" for="m">Duration (min)</label><input id="m" type="number" inputmode="numeric" min="5" step="5" value="${d.min}"><p class="err">Enter a duration.</p><div class="qc" id="qc">${[30,45,60,90,120].map(v=>`<button type="button" data-v="${v}">${dur(v)}</button>`).join('')}</div></div>
 <div class="field"><label class="fl" for="p">Price</label><div class="pre"><span>KES</span><input id="p" type="number" inputmode="numeric" min="0" step="50" value="${d.price}"></div><p class="err">Enter a price (0 for free).</p></div></div>
 <label class="op"><span><b>Show on storefront</b><span class="sub">Clients can find and book this service.</span></span><input id="sh" type="checkbox" ${d.show?'checked':''}><i class="ck">${I.ck}</i></label>
 <div class="two"><a class="btn" href="${back}">Cancel</a><button class="btn pr" type="submit">${editing?'Save changes':'Create service'}</button></div></form>
 <aside class="fprev"><p class="fl">Preview</p><div id="pv"></div></aside></div>`;
 let slot=0;
 const photos=()=>{$('#ph').innerHTML=[0,1,2].map(i=>d.imgs[i]?`<div class="slotp"><img alt="" src="${d.imgs[i]}"><button type="button" class="x" data-x="${i}" aria-label="Remove photo ${i+1}">${I.x}</button></div>`:`<button type="button" class="slotp" data-add="${i}">+ Add</button>`).join('');
  $$('[data-add]').forEach(b=>b.onclick=()=>{slot=+b.dataset.add;$('#file').click()});$$('[data-x]').forEach(b=>b.onclick=()=>{d.imgs.splice(+b.dataset.x,1);photos();pv()})};
 const pv=()=>{$('#pv').innerHTML=cardHTML({...d,status:'active'},'#').replace('href="#"','href="#" onclick="return false"')};
 $('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{d.imgs[Math.min(slot,d.imgs.length)]=r.result;photos();pv()};r.readAsDataURL(f);e.target.value=''};
 const sync=()=>{d.name=$('#n').value;d.description=$('#ds').value;d.min=$('#m').value;d.price=$('#p').value;d.show=$('#sh').checked;$$('#qc button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(d.min)));pv()};
 ['n','ds','m','p','sh'].forEach(k=>$('#'+k).oninput=sync);
 $$('#qc button').forEach(b=>b.onclick=()=>{$('#m').value=b.dataset.v;sync()});
 $('#f').onsubmit=e=>{e.preventDefault();sync();
  const bad={n:!d.name.trim(),m:!(+d.min>0),p:d.price===''||+d.price<0};
  Object.keys(bad).forEach(k=>$('#'+k).classList.toggle('bad',bad[k]));$('.pre').classList.toggle('bad',bad.p);
  if(Object.values(bad).some(Boolean)){$('input.bad')?.focus();return}
  const v={name:d.name.trim(),description:d.description.trim(),min:+d.min,price:+d.price,show:d.show,imgs:d.imgs};
  if(editing){Object.assign(editing,v);toast('Changes saved');location.hash='#/s/'+id}
  else{const n={id:String(nextId++),status:'active',...v};S.unshift(n);toast('Service created');location.hash='#/s/'+n.id}};
 photos();sync();
}

/* ---------- router ---------- */
function route(keep){
 const [,a,b]=(location.hash.slice(1)||'/').split('/');
 document.body.classList.toggle('hasbar',a==='s'&&!!find(b));document.body.classList.toggle('cust',V!==null);document.body.style.overflow='';
 if(a==='s'&&find(b))detail(b);else if(a==='new')form();else if(a==='edit'&&find(b))form(b);else list();
 if(keep!==1){window.scrollTo(0,0);app.classList.remove('in');void app.offsetWidth;app.classList.add('in')}
}
addEventListener('hashchange',()=>route());route();
</script>
</body>
</html>
