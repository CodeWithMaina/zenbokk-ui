const SM=t=>{const[h,m]=t.split(':');return+h*60+ +m},NOW=SM('15:10'),ST=[...new Set(AP.map(a=>a[5]))].sort((a,b)=>['Amina Hassan','John Kipchoge','Grace Wanjiru','Brian Otieno','Faith Achieng'].indexOf(a)-['Amina Hassan','John Kipchoge','Grace Wanjiru','Brian Otieno','Faith Achieng'].indexOf(b));let sm='list';

return m+`<li class="ti${a==nx?' nx':''}" data-st="${a[6]}"><span class="tt">${a[0]}<small>${a[1]} min</small></span><span class="rl"><i></i></span><div class="tb"><b><a href="#">${a[2]}</a>${a==nx?'<em class="nt">NEXT UP</em>':''}</b><span>${a[3]} · ${a[5].split(' ')[0]}</span>${a[6]=='pending'?'<span class="ra"><a href="#">Confirm</a><a href="#">Remind</a></span>':''}</div><div class="rt"><span class="pill">${a[6]}</span><small>${kes(a[4])}</small><small>${a[7]}</small></div></li>`}).join('')}</ul>`;
