if(m){P='pay';$('#pg').innerHTML=detail(+m[1]);nav('payments');dock()}else{P={payments:'pay',cashbook:'cb',expenses:'ex'}[h]||'pay';$('#pg').innerHTML=PG[P]();draw()}scrollTo(0,0)}
function rerender(){if(/^#payment-/.test(location.hash))route();else{var y=scrollY;$('#pg').innerHTML=PG[P]();var q=document.querySelector('[data-i=q]');if(q)q.value=Z[P].q;draw();scrollTo(0,y)}}
var A={nav:function(){var o=$('#nav').classList.toggle('open');$('#nscr').hidden=!o},soon:function(){toast('Not part of this design')},
fo:function(){SH='f';drawSheet()},x:function(){SH=null;drawSheet()},rec:function(v){SH=v;drawSheet();var e=$('#f-a');if(e)e.focus()},
save:function(v){var a=parseFloat($('#f-a').value.replace(/,/g,'')),d=$('#f-d').value.trim(),m=$('#f-m').value,t=$('#f-t').value||NOW;if(!(a>0)||!d){$('#f-e').textContent=!(a>0)?'Enter an amount greater than 0.':'Add a short description.';return}
var c=new Date(t+'T'+new Date().toTimeString().slice(0,8)),ref=(v==='out'?'EXP-':'INC-')+String(1000+(seq++)*7),p=$('#f-p').value.trim();
if(v==='out'){X.unshift({id:'X'+ref,c:c,d:nd(c),cat:$('#f-c').value,desc:d,payee:p,a:a,me:m,ref:ref})}
LG.push({id:'L'+ref,c:c,d:nd(c),k:v==='out'?'out':'in',a:a,desc:d,ref:ref,ext:'',me:m,cust:p,src:v==='out'?'expense':'owner',by:'You',pay:-1,n:d});SH=null;drawSheet();rerender();toast((v==='out'?'Expense':'Income')+' recorded · '+money(a))},
mn:function(v,el){var r=CF[P].find(v);if(r)menu(CF[P].menu(r),el)},open:function(v){mclose();location.hash='payment-'+v},
copy:function(v){mclose();(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){toast('Copied '+v)},function(){toast('Copy is not available here')})},
verify:function(v){mclose();var r=R[+v];verify(r);toast('Verified '+money(r.a)+' · added to cashbook');rerender()},reject:function(v){mclose();reject(R[+v]);toast('Claim rejected');rerender()},
vall:function(){var n=0;Object.keys(Z.pay.sel).forEach(function(i){var r=R[+i];if(r.s==='a'){verify(r);n++}});Z.pay.sel={};toast('Verified '+n+' claim'+(n>1?'s':''));draw()},
void:function(v){mclose();var e=CF.cb.find(v);e.void=true;X.forEach(function(x){if(x.ref===e.ref)x.void=true});toast('Entry voided');rerender()},
voidx:function(v){mclose();var e=CF.ex.find(v);e.void=true;LG.forEach(function(l){if(l.ref===e.ref)l.void=true});toast('Expense voided');rerender()},
goclaims:function(){Z.pay.tab='claims'},tab:function(v){Z.pay.tab=v;Z.pay.pg=1;if(/^#payment-/.test(location.hash))location.hash='payments';else draw()},lay:function(v){Z[P].lay=v;draw()},
sel:function(v){var s=Z[P].sel;s[v]?delete s[v]:s[v]=1;draw()},selpg:function(){var s=Z[P],L=rows(P).slice((s.pg-1)*s.ps,s.pg*s.ps),all=L.every(function(r){return s.sel[r.id]});L.forEach(function(r){all?delete s.sel[r.id]:s.sel[r.id]=1});draw()},sall:function(){rows(P).forEach(function(r){Z[P].sel[r.id]=1});draw()},sclr:function(){Z[P].sel={};draw()},
exp:function(){var s=Z[P],L=Object.keys(s.sel).map(function(i){return CF[P].find(i)}).filter(Boolean);csv(CF[P].csv(L));toast('Exported '+L.length+' row'+(L.length>1?'s':''))},
pg:function(v){Z[P].pg=+v;draw();scrollTo({top:$('#res').offsetTop-80,behavior:'smooth'})},
sort:function(v){var s=Z[P];s.sort=s.sort===v&&/-d$/.test(v)?v.replace('-d','-a'):v;s.pg=1;draw()},
fset:function(v){v=v.split('|');Z[P][v[0]]=v[1];Z[P].pg=1;draw();drawSheet()},
preset:function(v){var s=Z[P],p=v.split('|')[1];s.pr=p;s.from=s.to='';if(p==='today')s.from=s.to=TODAY;if(p==='7d'){s.from=add(TODAY,-6);s.to=TODAY}if(p==='30d'){s.from=add(TODAY,-29);s.to=TODAY}if(p==='month'){s.from=TODAY.slice(0,8)+'01';s.to=TODAY}s.pg=1;draw();drawSheet()},
fclr:function(v){v=v.split('|');var s=Z[P];if(v[0]==='dt'){s.from=s.to='';s.pr='all'}else s[v[0]]=v[1];s.pg=1;draw()},
clr:function(){var s=Z[P];Object.assign(s,{q:'',st:'all',me:'all',ty:'all',vd:'0',from:'',to:'',pr:'all',sort:'date-d',pg:1});var q=document.querySelector('[data-i=q]');if(q)q.value='';draw();drawSheet()}};
document.addEventListener('click',function(e){var m=$('#mn');if(!m.hidden&&!e.target.closest('#mn,[data-a=mn]'))mclose();var t=e.target.closest('[data-a]');if(!t||t.disabled||!A[t.dataset.a])return;if(t.tagName!=='A')e.preventDefault();A[t.dataset.a](t.dataset.v,t)});
document.addEventListener('input',function(e){var k=e.target.dataset.i;if(!k)return;var s=Z[P],v=e.target.value;if(k==='q')s.q=v;else if(k==='ps')s.ps=+v;else{s[k]=v;s.pr='custom'}s.pg=1;draw();if(k==='from'||k==='to'){var b=$('#sheet .sf .pr');if(b){var n=rows(P).length;b.textContent='Show '+n+' result'+(n===1?'':'s')}}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('#mn').hidden)mclose();else if(SH)A.x();else $('#nav').classList.remove('open'),$('#nscr').hidden=true}});
addEventListener('hashchange',route);addEventListener('scroll',function(){if(!$('#mn').hidden&&innerWidth>640)mclose()},{passive:true});
$('#burger').innerHTML=ic('tb',22);route();
})();
</script></body></html>
