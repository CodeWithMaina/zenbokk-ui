<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loyalty programs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F6F3;--sf:#fff;--ink:#1C1F23;--mut:#5B616B;--ln:#E9E7E2;--hv:#F9F8F5;--sel:#F3F6F3;--okb:#E3F1E8;--okt:#1B5233;--pdb:#FBF1D9;--pdt:#6B4E0B;--ofb:#ECEBE7;--oft:#454A52;--inv:#1C1F23;--invt:#fff;--ac:#2F6B4F;--av:#E5EBE3;--avt:#2F5A43;--scr:rgba(28,31,35,.4);--err:#A2473B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--sf:#1D1D1A;--ink:#F2F0EA;--mut:#A29E94;--ln:#2E2D29;--hv:#242421;--sel:#1F2A24;--okb:#1F3326;--okt:#9FD6B2;--pdb:#3A2F14;--pdt:#E8C77A;--ofb:#2A2A27;--oft:#B8B4AA;--inv:#F2F0EA;--invt:#1C1F23;--ac:#5FA583;--av:#26332B;--avt:#A8D6BB;--scr:rgba(0,0,0,.6);--err:#E08B7E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141412;--sf:#1D1D1A;--ink:#F2F0EA;--mut:#A29E94;--ln:#2E2D29;--hv:#242421;--sel:#1F2A24;--okb:#1F3326;--okt:#9FD6B2;--pdb:#3A2F14;--pdt:#E8C77A;--ofb:#2A2A27;--oft:#B8B4AA;--inv:#F2F0EA;--invt:#1C1F23;--ac:#5FA583;--av:#26332B;--avt:#A8D6BB;--scr:rgba(0,0,0,.6);--err:#E08B7E;color-scheme:dark}
*{box-sizing:border-box}
html{font-size:80%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.4 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;min-height:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:.4rem}
[hidden]{display:none!important}
h1,h2,h3{margin:0}
svg{flex:none}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
.page{max-width:1100px;margin:0 auto;padding:1rem clamp(.9rem,3vw,2rem) 4rem}
.rv{animation:in .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
/* header + buttons */
header{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;margin-bottom:1rem}
h1{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.cnt{font-size:.85rem;color:var(--mut);margin-top:.15rem}
.btn,.btn2,.dng,.rld{min-height:2.6rem;padding:0 1.1rem;border-radius:.8rem;font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;white-space:nowrap;transition:opacity .2s,background .2s,color .2s,border-color .2s}
.btn{border:1px solid var(--inv);background:var(--inv);color:var(--invt)}
.btn:hover{opacity:.9}.btn:active{transform:scale(.98)}.btn:disabled{opacity:.35;cursor:default}
.btn.dng2{background:var(--err);border-color:var(--err);color:#fff}
.btn2{border:1px solid var(--ln);background:var(--sf);color:var(--ink)}.btn2:hover{background:var(--hv)}
.lnk{background:none;border:0;padding:.4rem .6rem;color:var(--ac);font-weight:600;font-size:.9rem}
.lnk:hover{opacity:.8}
.nb .sm{display:none}
/* toolbar */
.tools{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.6rem 1rem;margin-bottom:1.1rem}
.srch{flex:1 1 220px;max-width:26rem;display:flex;align-items:center;gap:.55rem;min-height:2.6rem;padding:0 .9rem;border:1px solid var(--ln);border-radius:.8rem;background:var(--sf);color:var(--mut);transition:border-color .2s}
.srch:focus-within{border-color:var(--ink)}
.srch input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:16px;color:var(--ink)}
.srch input::placeholder{color:var(--mut)}
.srch kbd{font:inherit;font-size:.72rem;border:1px solid var(--ln);border-radius:.4rem;padding:.05rem .4rem;color:var(--mut)}
.srch input:not(:placeholder-shown)~kbd{display:none}
.tabs{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;padding:.1rem 0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:2.3rem;padding:0 .9rem;border-radius:99px;border:1px solid var(--ln);background:var(--sf);font-weight:500;font-size:.85rem;color:var(--ink);transition:background .2s,color .2s,border-color .2s}
.tabs button:hover{background:var(--hv)}
.tabs button.on{background:var(--inv);color:var(--invt);border-color:var(--inv)}
.tabs sup{font-size:inherit;vertical-align:baseline;line-height:0;opacity:.6;margin-left:.3rem}
/* status pills */
.st{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;font-weight:500;padding:.2rem .6rem;border-radius:99px;white-space:nowrap;background:var(--okb);color:var(--okt)}
.st i{width:.4rem;height:.4rem;border-radius:50%;background:currentColor;opacity:.7}
.st.off{background:var(--ofb);color:var(--oft)}
.st.draft{background:var(--pdb);color:var(--pdt)}
/* results: gallery on small, list on large */
.card{display:block;max-width:380px;width:100%}
.card>*{width:100%}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),380px));gap:2rem 1.5rem;justify-content:start}
.pc{display:block}
.res.anim .pc{animation:in .6s cubic-bezier(.2,.7,.2,1) both}
.th{transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.inf{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;max-width:380px;padding:.8rem .1rem 0}
.nm,.arr{display:none}
.rw{font-size:.95rem;font-weight:600;line-height:1.35}
.sb{font-size:.85rem;color:var(--mut);margin-top:.15rem}
@media(hover:hover) and (max-width:899px){.pc:hover .th{transform:translateY(-2px)}}
@media(min-width:900px){
 .res{display:block;background:var(--sf);border:1px solid var(--ln);border-radius:1.1rem;overflow:hidden}
 .pc{display:grid;grid-template-columns:200px 1fr auto;gap:1.6rem;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--ln);transition:background .2s}
 .pc:last-child{border-bottom:0}.pc:hover{background:var(--hv)}
 .th{width:200px;height:124px;overflow:hidden;border-radius:.6rem}
 .th .card{width:380px;max-width:none;transform:scale(.5263);transform-origin:0 0;pointer-events:none}
 .inf{display:block;padding:0;max-width:none}.inf .st{margin-top:.6rem}
 .nm{display:block;font-size:1.05rem;font-weight:700;margin-bottom:.2rem}
 .arr{display:block;color:var(--mut);transition:transform .25s,color .2s}
 .pc:hover .arr{transform:translateX(3px);color:var(--ink)}
}
.empty{padding:3rem 1rem;text-align:center;color:var(--mut);animation:in .5s both}
.empty h2{font-size:1.05rem;font-weight:700;color:var(--ink);margin:0 0 .3rem}
.empty p{margin:0 0 1rem;font-size:.9rem}
/* details */
.back{display:inline-flex;align-items:center;gap:.3rem;min-height:2.4rem;font-weight:500;color:var(--mut);margin-bottom:.4rem;transition:color .2s,transform .3s}
.back:hover{color:var(--ink);transform:translateX(-2px)}
.dg{display:grid;grid-template-columns:380px minmax(0,1fr);grid-template-areas:"side head" "side body";column-gap:2rem;align-items:start}
.dside{grid-area:side;position:sticky;top:1rem}
.dhd{grid-area:head;padding:.3rem 0 1.1rem}
.dbody{grid-area:body}
@media(max-width:900px){.dg{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "side" "body"}.dside{position:static;margin-bottom:1.4rem}}
.eyb{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:.4rem}
.dn{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0 0 .4rem}
.dd{color:var(--mut);font-size:.95rem;line-height:1.55;margin:0 0 .7rem;max-width:46ch}
.mt2{display:flex;flex-wrap:wrap;gap:.3rem .9rem;align-items:center;font-size:.85rem;color:var(--mut)}
.ptabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:1.4rem;border-bottom:1px solid var(--ln);background:var(--bg);overflow-x:auto;scrollbar-width:none;margin-bottom:1.1rem}
.ptabs::-webkit-scrollbar{display:none}
.ptabs a{min-height:2.7rem;display:inline-flex;align-items:center;font-weight:600;color:var(--mut);white-space:nowrap;transition:color .2s}
.ptabs a:hover,.ptabs a.on{color:var(--ink)}
.ptabs .ind{position:absolute;bottom:0;left:0;height:2px;width:0;background:var(--ink);transition:transform .5s cubic-bezier(.2,.7,.2,1),width .5s cubic-bezier(.2,.7,.2,1)}
.pn{animation:in .5s cubic-bezier(.2,.7,.2,1) both}
.sec{margin-bottom:1rem;background:var(--sf);border:1px solid var(--ln);border-radius:1.1rem;padding:1.1rem}
.sec.nb0{background:none;border:0;padding:0}
.sh{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:0 0 .9rem}
.sh h3{font-size:1.05rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.5rem,1fr));gap:.7rem}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:1rem;padding:.9rem}
.stat b{display:block;font-size:1.5rem;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.stat span{display:block;font-size:.8rem;color:var(--mut);margin-top:.15rem}
.hw{font-size:.95rem;line-height:1.6;margin:0 0 .8rem;max-width:52ch}
.rl{list-style:none;margin:0;padding:0}
.rl li{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-top:1px solid var(--ln);font-size:.92rem}
.rl li span{color:var(--mut)}.rl li b{font-weight:600;text-align:right}
.fl{display:grid;grid-template-columns:1fr 1fr;column-gap:2rem;margin:0}
.fl div{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--ln);font-size:.92rem}
.fl div:nth-last-child(-n+2){border-bottom:0;padding-bottom:0}
.fl dt{color:var(--mut)}.fl dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
@media(max-width:700px){.fl{grid-template-columns:1fr}.fl div:nth-last-child(2){border-bottom:1px solid var(--ln);padding-bottom:.7rem}}
/* customers */
.cact{display:flex;align-items:center;gap:.6rem}
#cq{width:12rem;min-height:2.3rem;padding:0 .8rem;border:1px solid var(--ln);border-radius:.8rem;background:var(--sf);font-size:16px;outline:none;transition:border-color .2s}
#cq:focus{border-color:var(--ink)}
.rld{min-height:2.3rem;padding:0 .8rem;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-size:.85rem}
.rld:hover{background:var(--hv)}.rld:disabled{cursor:default;opacity:.6}
.rld.spin svg{animation:spin 1s linear infinite}
.crs{background:var(--sf);border:1px solid var(--ln);border-radius:1.1rem;overflow:hidden;transition:opacity .3s}
.crs.stale{opacity:.45;pointer-events:none}
.crs .empty{animation:none}
.cr{display:grid;grid-template-columns:2.2rem minmax(0,1fr) 7rem 5.2rem 4.5rem;gap:.8rem;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--ln);transition:background .2s;animation:in .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--d,0s)}
.cr:last-child{border-bottom:0}.cr:hover{background:var(--hv)}
.crs.stale .cr,.crs.stale .bar i{animation:none}
.av{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--av);color:var(--avt);font-weight:600;font-size:.8rem;display:inline-flex;align-items:center;justify-content:center}
.av.sk{background:var(--ln)}
.cn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm{font-size:.85rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp span{display:block;font-size:.78rem;color:var(--mut);margin-top:.3rem}
.bar{height:.3rem;background:var(--ln);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);background:var(--ac);border-radius:99px;transform-origin:left;animation:fill 1s cubic-bezier(.2,.7,.2,1) .3s both}
.cx{font-size:.75rem;color:var(--mut)}.cx b{display:block;font-size:.9rem;font-weight:600;color:var(--ink)}
@media(max-width:760px){.cr{grid-template-columns:2.2rem minmax(0,1fr) 5.8rem}.cx{display:none}}
.sk{background:var(--ln);border-radius:.3rem;animation:pulse 1.5s ease-in-out infinite}
.note{text-align:center;font-size:.85rem;color:var(--mut);margin-top:.9rem;min-height:1.2rem}
/* settings */
.ctl{background:var(--sf);border:1px solid var(--ln);border-radius:1.1rem;overflow:hidden}
.tg,.act{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;padding:.9rem 1.1rem;border:0;border-bottom:1px solid var(--ln);background:none;text-align:left;font-size:.95rem;font-weight:600}
.ctl>:last-child{border-bottom:0}
.act{transition:background .2s}.act:hover{background:var(--hv)}
.tg small,.act small{display:block;font-weight:400;color:var(--mut);font-size:.85rem;margin-top:.1rem}
.act .arx{color:var(--mut);transition:transform .25s,color .2s}.act:hover .arx{transform:translateX(3px);color:var(--ink)}
.sw{width:2.7rem;height:1.5rem;border-radius:99px;border:1px solid var(--ln);background:var(--ofb);position:relative;flex:none;transition:background .3s,border-color .3s}
.sw::after{content:"";position:absolute;top:.17rem;left:.17rem;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--sf);box-shadow:0 0 0 1px var(--ln);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.sw[aria-checked=true]{background:var(--ac);border-color:var(--ac)}
.sw[aria-checked=true]::after{transform:translateX(1.2rem);box-shadow:none}
.dz{margin-top:1rem;background:var(--sf);border:1px solid var(--ln);border-radius:1.1rem;padding:1.1rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.dz h3{font-size:1.05rem;font-weight:700;margin:0 0 .15rem}
.dz p{margin:0;font-size:.85rem;color:var(--mut);max-width:44ch}
.dng{border:1px solid var(--err);background:none;color:var(--err)}
.dng:hover{background:var(--err);color:var(--sf)}
/* sheets / drawers */
dialog.dr{margin:0 0 0 auto;height:100dvh;max-height:none;width:min(30rem,100%);border:0;border-left:1px solid var(--ln);padding:0;background:var(--sf);color:var(--ink);transform:translateX(24px);opacity:0;transition:transform .4s cubic-bezier(.2,.7,.2,1),opacity .3s}
dialog.dr.in{transform:none;opacity:1}
dialog.dr::backdrop{background:var(--scr);opacity:0;transition:opacity .3s}
dialog.dr.in::backdrop{opacity:1}
dialog.dr.wide{width:min(1040px,100%)}
.dr form{display:flex;flex-direction:column;height:100%}
.dh{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--ln);position:relative}
.dh h2{font-size:1.05rem;font-weight:700}
.x{width:2.5rem;height:2.5rem;border:0;background:none;border-radius:.7rem;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:1.5rem;line-height:1;transition:background .2s}
.x:hover{background:var(--hv)}
.db{flex:1;overflow:auto;padding:1rem 1.2rem}
.dbx{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 440px}
.dbx .db{overflow:auto;min-height:0}
.dpane{border-left:1px solid var(--ln);background:var(--hv);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;gap:1rem}
.dpane .pvw{width:100%;max-width:380px}
.pnote{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0}
.pvw{margin-bottom:1.4rem}
.pvi{display:none;margin-bottom:1.2rem}
@media(max-width:1020px){.dbx{grid-template-columns:minmax(0,1fr)}.dpane{display:none}.pvi{display:block}}
.df{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:.6rem;padding:.9rem 1.2rem calc(.9rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln)}
.fs{margin-bottom:1.6rem}
.fs>.sh{margin-bottom:.8rem}.fs>.sh h3{font-size:.95rem}
.fld{margin-bottom:.9rem}
.lbl{display:block;font-weight:600;font-size:.85rem;margin-bottom:.4rem}
.fld input,.fld select,.fld textarea{display:block;width:100%;min-height:2.7rem;padding:0 .8rem;border:1px solid var(--ln);border-radius:.8rem;background:var(--sf);font-size:16px;font-weight:400;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.fld textarea{padding:.65rem .8rem;resize:none;line-height:1.4}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ink)}
.fld.bad input,.fld.bad textarea{border-color:var(--err)}
.err{color:var(--err);font-size:.78rem;margin-top:.3rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem}
.tyg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.ty{position:relative;display:block;border:1px solid var(--ln);border-radius:.9rem;padding:.7rem .9rem;background:var(--sf);cursor:pointer;transition:border-color .2s,background .2s}
.ty input,.gi input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0;padding:0;border:0}
.ty b{display:block;font-size:.95rem;font-weight:600}
.ty span{display:block;color:var(--mut);font-size:.85rem;margin-top:.1rem}
.ty:hover{background:var(--hv)}
.ty:has(input:checked){border-color:var(--ac);background:var(--sel)}
.ty:has(input:focus-visible),.gi input:focus-visible+.gt{outline:2px solid var(--ac);outline-offset:2px}
.gl{font-size:.82rem;font-weight:600;margin:.4rem 0 .55rem}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(156px,1fr));gap:.5rem}
.gi{position:relative;cursor:pointer;display:block}
.gt{border:1px solid var(--ln);border-radius:.9rem;padding:.7rem;background:var(--sf);transition:border-color .2s,background .2s}
.gi:hover .gt{background:var(--hv)}
.gi input:checked+.gt{border-color:var(--ac);background:var(--sel)}
.gt span{display:block;font-size:.9rem;font-weight:600;margin-top:.5rem}
.dth{width:127px;height:76px;overflow:hidden;border-radius:.4rem;margin:0 auto;pointer-events:none}
.dth .card{width:380px;max-width:none;transform:scale(.335);transform-origin:0 0}
.grab,.prg{display:none}
/* confirm */
dialog.cf{margin:auto;width:min(28rem,calc(100% - 2rem));border:1px solid var(--ln);border-radius:1.1rem;padding:1.4rem;background:var(--sf);color:var(--ink);opacity:0;transform:translateY(12px) scale(.98);transition:opacity .3s,transform .4s cubic-bezier(.2,.7,.2,1)}
dialog.cf.in{opacity:1;transform:none}
dialog.cf::backdrop{background:var(--scr);opacity:0;transition:opacity .3s}
dialog.cf.in::backdrop{opacity:1}
.cf h2{font-size:1.15rem;font-weight:700;margin:0 0 .4rem}
.cf p{color:var(--mut);font-size:.92rem;line-height:1.55;margin:0 0 1.1rem}
.cf .fld{margin:0 0 1.1rem}
.cfb{display:flex;justify-content:flex-end;gap:.6rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--inv);color:var(--invt);padding:.8rem 1.2rem;border-radius:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:calc(100% - 2rem);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* mobile */
@media(max-width:600px){
 header{align-items:center}
 h1{font-size:1.5rem}.dn{font-size:1.5rem}
 .nb{padding:0 .9rem}.nb .lg{display:none}.nb .sm{display:inline}
 .srch{max-width:none}
 dialog.dr,dialog.dr.wide{margin:auto 0 0;width:100%;max-width:none;height:92vh;height:92dvh;max-height:none;border:0;border-radius:1.5rem 1.5rem 0 0;transform:translateY(100%);opacity:1;transition:transform .55s cubic-bezier(.2,.7,.2,1)}
 dialog.dr.in{transform:none}
 dialog.dr.drag{transition:none}
 dialog.dr#dd{height:auto;max-height:92dvh}
 #dd form{max-height:92dvh}
 .dh{padding:1.5rem 1.2rem .8rem;touch-action:none;cursor:grab}

const dark=(n,lbl)=>`<div style="background-color: #111111; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; border-radius: 8px; padding: 24px; width: 100%; max-width: 380px; box-sizing: border-box; position: relative; overflow: hidden; border: 1px solid #333333;"><div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px;"><div style="font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: #999999;">${n}</div><div style="width: 32px; height: 24px; background-color: #222222; border-radius: 4px;"></div></div><div style="margin-bottom: 32px;"><div style="font-size: 32px; font-weight: 400; letter-spacing: -0.5px; line-height: 1;">{{totalStamps}} <span style="font-size: 16px; color: #888888;">/ {{stampsRequired}}</span></div><div style="font-size: 12px; color: #888888; margin-top: 8px;">Stamps Collected</div></div><div style="display: flex; justify-content: space-between; align-items: flex-end;"><div><div style="font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #666666; margin-bottom: 4px;">Member Since</div><div style="font-size: 13px; color: #dddddd;">{{enrolledYear}}</div></div><div style="font-size: 11px; font-weight: 500; color: #111111; background-color: #ffffff; padding: 6px 12px; border-radius: 4px;">${lbl}</div></div></div>`;

  }
  $('cmn').textContent=new Intl.DateTimeFormat('en-GB',{month:'long',year:'numeric'}).format(cM);
  const g=$('cg');g.style.setProperty('--dx',(dx||0)*12+'px');g.innerHTML=h;g.style.animation='none';g.offsetHeight;g.style.animation='';
  $('cqk').innerHTML=(cT==='sd'?[['today','Today'],['tom','Tomorrow'],['mon','Next Monday']]:[['1m','+1 month'],['3m','+3 months'],['6m','+6 months']]).map(a=>`<button type="button" data-q="${a[0]}">${a[1]}</button>`).join('');
}
function openCal(t){
  clearTimeout(cTimer);cT=t;const v=$(t).value,s=$('sd').value;
  const b=v?cfrom(v):(t==='ed'&&s?cfrom(s):new Date());cM=new Date(b.getFullYear(),b.getMonth(),1);renderCal(0);
  document.querySelectorAll('.dpk').forEach(x=>x.classList.toggle('open',x.dataset.cal===t));
  cal.hidden=false;calScr.hidden=false;
  if(matchMedia('(min-width:601px)').matches){
    const r=$(t+'b').getBoundingClientRect(),w=cal.offsetWidth,h=cal.offsetHeight;
    let top=r.bottom+6;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-6);
    cal.style.top=top+'px';cal.style.left=Math.min(Math.max(8,r.left),innerWidth-w-8)+'px';
  }else{cal.style.top=cal.style.left=''}
  requestAnimationFrame(()=>cal.classList.add('in'));
}
function closeCal(now){
  cal.classList.remove('in');calScr.hidden=true;document.querySelectorAll('.dpk').forEach(x=>x.classList.remove('open'));
  clearTimeout(cTimer);
  if(now){cal.hidden=true;return}
  cTimer=setTimeout(()=>{cal.hidden=true},300);
}
cal.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const c=b.dataset.c;
  if(c==='prev'||c==='next'){const k=c==='next'?1:-1;cM=new Date(cM.getFullYear(),cM.getMonth()+k,1);renderCal(k);return}
  if(c==='clear'){setDate(cT,'');closeCal();return}
  if(c==='close'){closeCal();return}
  const v=b.dataset.d||(b.dataset.q&&quick(b.dataset.q));if(!v)return;
  setDate(cT,v);if(cT==='sd'&&$('ed').value&&$('ed').value<=v)setDate('ed','');
  closeCal();
});
calScr.addEventListener('click',()=>closeCal());
document.addEventListener('click',e=>{const t=e.target.closest('[data-cal]');if(t)openCal(t.dataset.cal)});
const dbS=dr.querySelector('.db');
dbS.addEventListener('scroll',()=>{const m=dbS.scrollHeight-dbS.clientHeight;$('prg').style.transform=`scaleX(${m>0?dbS.scrollTop/m:0})`},{passive:true});
/* swipe a bottom sheet down to dismiss */
document.querySelectorAll('dialog.dr .dh').forEach(h=>{
  const dl=h.closest('dialog');let y0=null,t0=0,d=0;
  h.addEventListener('pointerdown',e=>{if(!matchMedia('(max-width:600px)').matches||e.target.closest('button'))return;y0=e.clientY;t0=e.timeStamp;d=0;dl.classList.add('drag');h.setPointerCapture(e.pointerId)});
  h.addEventListener('pointermove',e=>{if(y0===null)return;d=Math.max(0,e.clientY-y0);dl.style.transform=`translateY(${d}px)`});
  const end=e=>{if(y0===null)return;const v=d/Math.max(1,e.timeStamp-t0);y0=null;dl.classList.remove('drag');dl.style.transform='';if(d>110||v>.6)hideDr(dl)};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
});
$('new').onclick=openDr;
/* events */
$('q').addEventListener('input',render);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;render()}
  if(e.target.id==='rst'){$('q').value='';filter='all';render()}
});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&!dr.open&&!$('list').hidden){e.preventDefault();$('q').focus()}});
addEventListener('hashchange',route);
render();route();
</script>
