<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Punched · Storefront Builder (prototype)</title>

<style>
:root{--ui:#fff;--bd:#e7e5e0;--sf:#f6f5f2;--ink:#1d1c1a;--mu:#7a766e;--ac:#2f5d50}
*{box-sizing:border-box}body{margin:0;font:13px/1.4 Figtree,system-ui,sans-serif;color:var(--ink);background:var(--sf);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.top{height:54px;background:var(--ui);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;padding:0 14px}
.top .sp{flex:1}.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 12px}.btn:hover{background:var(--sf)}

.seg{display:flex;background:var(--sf);border-radius:9px;padding:2px}.seg button{border:0;background:none;padding:5px 12px;border-radius:7px}.seg .on{background:#fff;box-shadow:0 1px 2px #0002}
.name{font-weight:600}.name small{display:block;font-weight:400;color:var(--mu);font-size:11px}
.main{flex:1;display:grid;grid-template-columns:268px 1fr 308px;min-height:0}
.side{background:var(--ui);overflow:auto;padding:14px}.side.l{border-right:1px solid var(--bd)}.side.r{border-left:1px solid var(--bd)}

.row{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:8px;border:1px solid transparent;cursor:pointer;background:#fff}

.row.drop{border-top:2px solid var(--ac)}.ib{border:0;background:none;padding:2px 5px;border-radius:5px;color:var(--mu)}.ib:hover{background:#0001;color:var(--ink)}
.f{margin-bottom:11px}.f>label{display:block;color:var(--mu);margin-bottom:4px;font-size:12px}
input[type=text],textarea,select{width:100%;border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font:inherit;background:#fff}textarea{min-height:64px;resize:vertical}

.chk{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.th{border:1px solid var(--bd);border-radius:9px;padding:6px;background:#fff;text-align:left}

.th i:before,.th i:after{content:"";position:absolute;background:#bbb6a8;border-radius:2px;height:5px}
.th i.a:before{left:6px;top:6px;width:14px}.th i.a:after{right:6px;top:6px;width:26px}
.th i.b:before{left:50%;margin-left:-7px;top:6px;width:14px}.th i.b:after{left:50%;margin-left:-20px;top:20px;width:40px}
.th i.c:before{left:6px;top:6px;width:20px}.th i.c:after{left:6px;top:20px;width:50px;background:#d9d4c7;height:12px}
.th i.d:before{left:6px;top:15px;width:30px;height:8px}.th i.d:after{right:6px;top:6px;width:30px;height:26px;background:#d9d4c7}
.tabs{display:flex;gap:2px;margin-bottom:14px;background:var(--sf);padding:2px;border-radius:9px}.tabs button{flex:1;border:0;background:none;padding:5px 0;border-radius:7px}.tabs .on{background:#fff;box-shadow:0 1px 2px #0002}
.stage{overflow:auto;padding:22px;display:flex;justify-content:center;align-items:flex-start}
.frame{background:#fff;box-shadow:0 10px 40px #0002;border-radius:10px;overflow:hidden;transition:width .3s;width:100%;max-width:1180px;container-type:inline-size}
.frame.tablet{max-width:768px}.frame.mobile{max-width:390px;border-radius:26px;border:8px solid #1d1c1a}
.sw{display:flex;gap:3px}.sw b{width:18px;height:18px;border-radius:50%;border:1px solid #0002}
.mod{position:fixed;inset:0;background:#1d1c1acc;display:none;align-items:center;justify-content:center;z-index:9}.mod.open{display:flex}
.box{background:#fff;border-radius:14px;width:min(960px,94vw);max-height:88vh;overflow:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--sf);cursor:pointer;text-align:left;padding:0}.card.on{border-color:var(--ac)}
.card .im{height:130px;background-size:cover;background-position:center}.card p{margin:0;padding:8px 10px}.card small{color:var(--mu)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid var(--bd);border-radius:99px;padding:4px 12px;background:#fff}.pill.on{background:var(--ink);color:#fff}

/* ---------- storefront (rendered in preview) ---------- */
#site{font-family:var(--bf);color:var(--tx);background:var(--bg);font-size:16px}

.logo{display:flex;align-items:center;gap:9px;font:500 21px var(--hf)}.logo i{width:28px;height:28px;border-radius:50%;background:var(--a);display:block}
.hd nav{display:flex;gap:24px;font-size:14px}.hd .cta,.bt{background:var(--bb);color:var(--bt);border-radius:var(--r);padding:11px 22px;border:1px solid var(--bb);font:500 14px var(--bf);display:inline-block}
.bt.ol{background:transparent;color:inherit;border-color:currentColor}.burger{display:none;font-size:24px;margin-left:auto}
.hd.classic nav{margin-left:auto}.hd.centered{flex-direction:column;gap:12px}.hd.split{justify-content:space-between}.hd.split .logo{order:2}.hd.split nav{order:1;flex:1}.hd.split .cta{order:3;flex:1;text-align:right;background:none;border:0;color:inherit;padding:0}
.hd.minimal nav{display:none}.hd.minimal .burger{display:block}.hd.minimal .cta{display:none}
.hero{position:relative;color:#fff;display:flex;align-items:center;padding:110px 40px 80px;min-height:560px;background:linear-gradient(#0000,#0000),var(--hi) center/cover,#2a2622}
.hero:after{content:"";position:absolute;inset:0;background:var(--hc);opacity:var(--ho);z-index:0}.hero>div{position:relative;z-index:1;max-width:620px}
.hero h1{font-size:clamp(38px,7cqw,68px);line-height:1.04}.hero p{font-size:18px;opacity:.9;margin:18px 0 28px;max-width:46ch}.hero .bts{display:flex;gap:12px;flex-wrap:wrap}
.hero.centered{justify-content:center;text-align:center}.hero.centered p{margin-inline:auto}.hero.centered .bts{justify-content:center}.hero.right{justify-content:flex-end;text-align:right}.hero.right .bts{justify-content:flex-end}
.hero.split{background:var(--hc);display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:90px 40px 50px}.hero.split:after{display:none}.hero.split:before{content:"";order:2;background:var(--hi) center/cover;border-radius:var(--r);min-height:380px}
.sec{padding:80px 40px}.sec h2{font-size:clamp(28px,4.5cqw,42px);margin-bottom:10px}.sec .lead{color:var(--mt);max-width:52ch;margin:0 0 34px}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.cols.two{grid-template-columns:1fr 1fr;gap:50px;align-items:center}
.sc{background:var(--sfc);border-radius:var(--r);overflow:hidden;border:1px solid var(--bdr)}.sc .im{aspect-ratio:4/5;background:center/cover #bbb}.sc div{padding:16px}.sc h3{font-size:20px}.sc span{color:var(--mt);font-size:14px}
.pic{aspect-ratio:4/5;background:center/cover #bbb;border-radius:var(--r)}.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.gal div{aspect-ratio:1;background:center/cover #bbb;border-radius:var(--r)}
.alt{background:var(--sfc)}.q{font:500 clamp(22px,3.6cqw,32px) var(--hf);line-height:1.3}.q small{display:block;font:14px var(--bf);color:var(--mt);margin-top:12px}
.bk{background:var(--p);color:var(--bg);text-align:center}.bk .bt{background:var(--bg);color:var(--p);border-color:var(--bg)}.hrs{display:flex;justify-content:space-between;border-bottom:1px solid var(--bdr);padding:10px 0;max-width:420px}
.ft{padding:56px 40px 28px;background:var(--fbg);color:var(--ftx)}.ft .cols{grid-template-columns:2fr 1fr 1fr 1.4fr;gap:30px}.ft h3{font-size:15px;margin-bottom:10px}.ft p,.ft a{display:block;opacity:.75;font-size:14px;margin:0 0 6px}.ft .cp{margin-top:34px;padding-top:16px;border-top:1px solid #fff3;opacity:.6;font-size:13px}
.ft.centered{text-align:center}.ft.centered .cols{display:block}.ft.centered .cols>div:not(:first-child){display:none}.ft.minimal .cols>div:not(:first-child){display:none}.ft.minimal .cols{display:block}
.tablet .sec,.tablet .hd,.tablet .hero,.tablet .ft{padding-left:28px;padding-right:28px}.tablet .cols{grid-template-columns:1fr 1fr}.tablet .gal{grid-template-columns:repeat(2,1fr)}.tablet .ft .cols{grid-template-columns:1fr 1fr}
.mobile .hd nav,.mobile .hd .cta{display:none}.mobile .burger{display:block}.mobile .hd{padding:14px 18px;flex-direction:row;gap:0}.mobile .hd.split .logo,.mobile .hd.split nav{order:0;flex:0}
.mobile .sec,.mobile .hero,.mobile .ft{padding:46px 18px}.mobile .cols,.mobile .cols.two,.mobile .hero.split,.mobile .ft .cols{grid-template-columns:1fr}.mobile .gal{grid-template-columns:1fr 1fr}.mobile .hero{min-height:480px}
.drawer{background:var(--bg);color:var(--tx);padding:70px 24px 24px;position:absolute;inset:0 0 auto 0;z-index:8;display:none;flex-direction:column;gap:16px;font:500 22px var(--hf);box-shadow:0 20px 40px #0004}.drawer.open{display:flex}
.mobile .hd.tr{position:absolute}#site{position:relative}
.top{overflow-x:auto}.top>*{flex:none}.top select{width:auto;padding:5px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--ui);color:var(--ink)}.mu{color:var(--mu)}.main{min-height:0}.stage{min-width:0;overflow:hidden;align-items:stretch;padding:16px}
.frame{display:flex;flex-direction:column;position:relative}.scroll{flex:1;min-height:0;overflow:auto}#dl{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.scrim{position:absolute;inset:0;background:#0007;opacity:0;transition:opacity .35s}.scrim.open{opacity:1;pointer-events:auto}
.drw{position:absolute;background:var(--bg);color:var(--tx);padding:26px;display:flex;flex-direction:column;gap:16px;font:500 22px var(--hf);transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s;pointer-events:auto;box-shadow:0 0 50px #0005}
.drw.left{left:0;top:0;bottom:0;width:78%;max-width:340px;transform:translateX(-105%)}.drw.right{right:0;top:0;bottom:0;width:78%;max-width:340px;transform:translateX(105%)}.drw.top{left:0;right:0;top:0;transform:translateY(-105%)}
.drw.full{inset:0;opacity:0;transform:scale(1.04);visibility:hidden;font-size:30px;justify-content:center}.drw.open{transform:none;opacity:1;visibility:visible}.drw:not(.open){pointer-events:none}
.drw .x{align-self:flex-end;cursor:pointer;font-size:20px}.drw .k{font-size:17px;opacity:.7;padding-left:16px}.drw span{cursor:pointer}
.hdw{position:relative;z-index:4}.hdw.stk{position:sticky;top:0}.hdw.ov{height:0}.hd.sh{box-shadow:0 6px 24px #0002}.hd.bd{border-bottom:1px solid var(--htx)}
.hd.pill{margin:14px 40px;border-radius:99px;padding-inline:26px}.hd.pill.tr{background:var(--hbg);color:var(--htx)}.mobile .hd.pill{margin:10px 12px}
.ann{background:var(--p);color:var(--bg);text-align:center;padding:7px;font-size:13px}.hd nav>a{position:relative;cursor:pointer}
.menu{position:absolute;top:100%;left:-14px;min-width:170px;background:var(--bg);color:var(--tx);padding:8px;border-radius:var(--r);box-shadow:0 12px 30px #0003;display:none;flex-direction:column;z-index:6}
.hd nav>a:hover .menu{display:flex}.menu span{padding:7px 12px;border-radius:6px}.menu span:hover{background:var(--sfc)}
.hero{min-height:560px}.hero.ht-compact{min-height:380px}.hero.ht-tall{min-height:720px}.ha-center,.h-centered,.h-gradient{justify-content:center;text-align:center}.ha-center p,.h-centered p,.h-gradient p{margin-inline:auto}
.ha-center .bts,.h-centered .bts,.h-gradient .bts{justify-content:center}.ha-right{justify-content:flex-end;text-align:right}.ha-right .bts{justify-content:flex-end}
.h-split,.h-splitr{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:110px 40px 50px;background:var(--hc);align-items:center}.h-split:after,.h-splitr:after,.h-minimal:after,.h-gradient:after{display:none}
.h-split:before,.h-splitr:before{content:"";background:var(--hi) center/cover;border-radius:var(--r);min-height:380px}.h-split:before{order:2}
.h-minimal{background:var(--sfc);color:var(--tx);padding:140px 40px 60px}.h-minimal>div{max-width:900px}.h-minimal h1{font-size:clamp(40px,8cqw,84px)}.h-gradient{background:linear-gradient(135deg,var(--p),var(--a))}
.facts{position:absolute;left:0;right:0;bottom:0;display:flex;gap:30px;padding:16px 40px;background:#0007;font-size:14px;flex-wrap:wrap;z-index:1}.facts b{margin-right:4px}
.sec.bg-surface{background:var(--sfc)}.sec.bg-primary{background:var(--p);color:var(--bg)}.sec.bg-accent{background:var(--a);color:#fff}.bg-primary .lead{color:inherit;opacity:.8}.bg-primary .bt{background:var(--bg);color:var(--p);border-color:var(--bg)}
.pd-compact{padding-block:40px}.pd-normal{padding-block:80px}.pd-generous{padding-block:130px}.al-center{text-align:center}.al-center .lead,.al-center .hrs{margin-inline:auto}
.rev .pic{order:2}.hrs.wide{max-width:none}.cols{grid-template-columns:repeat(var(--c,3),1fr)}.gal{grid-template-columns:repeat(var(--c,4),1fr)}.gal.feat div:first-child{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.q.one{font-size:clamp(26px,4cqw,40px);max-width:30ch;margin:auto}.map{aspect-ratio:4/3;border-radius:var(--r);background:radial-gradient(circle at 55% 45%,var(--a) 0 7px,transparent 8px),repeating-linear-gradient(45deg,var(--sfc) 0 18px,#0000000d 18px 20px)}
@keyframes aF{from{opacity:0}}@keyframes aU{from{opacity:0;transform:translateY(32px)}}@keyframes aL{from{opacity:0;transform:translateX(-40px)}}@keyframes aZ{from{opacity:0;transform:scale(.94)}}@keyframes aB{from{opacity:0;filter:blur(14px)}}
.play .an-fade{animation:aF var(--sp) both}.play .an-up{animation:aU var(--sp) cubic-bezier(.2,.7,.2,1) both}.play .an-left{animation:aL var(--sp) both}.play .an-zoom{animation:aZ var(--sp) both}.play .an-blur{animation:aB var(--sp) both}
.play [style*="--i"]{animation-delay:calc(var(--i)*110ms)}.pt-fade{animation:aF .45s}.pt-slide{animation:aL .45s}
.hv-lift .sc,.hv-lift .bt,.hv-lift .gal div{transition:transform .25s,box-shadow .25s}.hv-lift .sc:hover,.hv-lift .gal div:hover{transform:translateY(-6px);box-shadow:0 14px 30px #0003}.hv-lift .bt:hover{transform:translateY(-2px)}
.hv-glow .bt,.hv-glow .sc{transition:box-shadow .3s}.hv-glow .bt:hover,.hv-glow .sc:hover{box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 35%,transparent),0 0 28px var(--a)}
.hv-zoom .sc .im,.hv-zoom .gal div{transition:transform .5s}.hv-zoom .sc:hover .im,.hv-zoom .gal div:hover{transform:scale(1.07)}
.th i.e:before{left:6px;top:6px;width:30px;height:26px;background:#d9d4c7}.th i.e:after{right:6px;top:15px;width:30px;height:8px}.th i.f:before{left:6px;top:10px;width:60px;height:8px}.th i.f:after{left:6px;top:24px;width:34px}
.th i.g{background:linear-gradient(135deg,#6f8f84,#d9b08c)}.th i.h{box-shadow:inset 0 -8px #bbb6a8}.th i.p:before{left:6px;right:6px;top:8px;width:auto;height:12px;border-radius:9px}
.ni,.it{border:1px solid var(--bd);border-radius:10px;padding:6px;margin-bottom:8px}.it{display:flex;flex-direction:column;gap:6px}.ni .sub,.kid,.rw{display:flex;gap:6px;margin:6px 0 0}.kid{margin-left:14px}.ni select,.kid input{padding:4px 6px}
.mnav{display:none;border-top:1px solid var(--bd);background:var(--ui)}.mnav button{flex:1;padding:12px;border:0;background:none}.mnav .on{font-weight:600;color:var(--ac)}
@media(max-width:980px){.main{display:block;position:relative}.side,.stage{position:absolute;inset:0;display:none;width:100%}body[data-pane=left] #left,body[data-pane=right] #right{display:block}body[data-pane=mid] .stage{display:flex}.mnav{display:flex}.top .sp,.name small{display:none}.stage{padding:8px}}
body.dk{--ui:#1c1b19;--bd:#35332f;--sf:#121110;--ink:#f1eee8;--mu:#9b968b;--ac:#7cc4ad}
body.dk input[type=text],body.dk textarea,body.dk select,body.dk .btn,body.dk .row,body.dk .th,body.dk .pill,body.dk .tabs .on,body.dk .seg .on,body.dk input[type=color]{background:var(--ui);color:var(--ink)}
body.dk .btn.pri,body.dk .pill.on{background:var(--ink);color:#111}body.dk .row.on{background:#26332e}body.dk .box{background:var(--ui);color:var(--ink)}
/* ===== v3: premium header / hero / footer / drawer ===== */
.bt{padding:15px 30px;font-weight:500;letter-spacing:.01em;line-height:1;cursor:pointer;transition:transform .25s,box-shadow .25s,background .25s}.bt.ol{background:transparent;color:inherit;border:1px solid currentColor}

#site>div{display:contents}

.caps nav>a{text-transform:uppercase;letter-spacing:.14em;font-size:11.5px;font-weight:600}

.fx-underline nav>a:after{left:14px;right:14px;bottom:5px;height:1.5px;background:currentColor;transform:scaleX(0);transform-origin:left}.fx-underline nav>a:hover:after,.fx-underline nav>a.on:after{transform:scaleX(1)}
.fx-dot nav>a:after{left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--a);transform:scale(0)}.fx-dot nav>a:hover:after,.fx-dot nav>a.on:after{transform:scale(1)}

function openTpl(){const cs=['All',...new Set(TPL.map(t=>t.c))];M(`<div style="display:flex;justify-content:space-between"><h3>Templates</h3><button class="btn" onclick="closeM()">Close</button></div><div class="pills">${cs.map(c=>`<button class="pill ${c===cat?'on':''}" onclick="cat='${c}';openTpl()">${c}</button>`).join('')}</div><div class="grid">${TPL.filter(t=>cat==='All'||t.c===cat).map(t=>`<button class="card ${S.tpl===t.id?'on':''}" onclick="useTpl('${t.id}')"><div class="im" style="background-image:${bg(IMG[t.img].u)};box-shadow:inset 0 -50px 40px -20px ${t.t.p}"></div><p><b style="font-family:${t.t.hf}">${t.n}</b><br><small>${t.c}</small></p></button>`).join('')}</div>`)}
function useTpl(id){S=fresh(id);sel='hero';pi=0;tab='structure';commit(1);closeM();all();play();toast('Template applied')}
function openMedia(t){mt=t;M(`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><h3>Media library</h3><input type="text" placeholder="Search images" style="max-width:220px" oninput="document.querySelectorAll('#modbox .card').forEach(c=>c.style.display=c.dataset.n.includes(this.value.toLowerCase())?'':'none')"><label class="btn pri">Upload<input type="file" accept="image/*" hidden onchange="media.unshift({u:URL.createObjectURL(this.files[0]),n:this.files[0].name,s:'new'});openMedia(mt)"></label><button class="btn" onclick="closeM()">Close</button></div><br><div class="grid">${media.map((m,i)=>`<button class="card ${t&&get(S,t)===m.u?'on':''}" data-n="${m.n}" onclick="pickImg(${i})"><div class="im" style="background-image:${bg(m.u)}"></div><p>${m.n}<br><small>${m.s}</small></p></button>`).join('')}</div><p class="mu">${t?'Click an image to use it.':'Pick a section image from its own panel to apply one.'}</p>`)}
function pickImg(i){if(mt){set(S,mt,media[i].u);commit(1);closeM();all();toast('Image updated')}else toast(media[i].n+' · '+media[i].s)}
pane('mid');all();btns();play();
</script></body></html>
